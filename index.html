    // Clic sur une part d'un graphique de l'Accueil (jour / semaine / mois) :
    // bascule vers la page Recherche avec la plage de dates du graphique et
    // les filtres correspondant à la part cliquée (à faire / urgentes / terminées)
    function homeChartDrillDown(data, kind, filter) {
      const now = new Date();
      let fromStr, toStr;
      if (data === 'today') {
        fromStr = isoDate(now);
        toStr = '';
      } else if (data === 'month') {
        fromStr = isoDate(new Date(now.getFullYear(), now.getMonth(), 1));
        toStr = isoDate(new Date(now.getFullYear(), now.getMonth() + 1, 0));
      } else { // 'week'
        const dow = now.getDay();
        const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (dow === 0 ? -6 : 1 - dow));
        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        fromStr = isoDate(monday);
        toStr = isoDate(sunday);
      }
      filterStatus = kind === 'done' ? 'done' : 'todo';
      filterUrgency = kind === 'urgent' ? 'urgent' : (kind === 'todo' ? 'normal' : 'all');
      filterCategory = 'all';
      filterType = filter === 'rdv' ? 'rdv' : 'task';
      filterLate = false;
      filterDate = null;
      filterPeriod = data === 'today'
        ? { mode: 'on', from: fromStr, to: '' }
        : { mode: 'between', from: fromStr, to: toStr };
      // La recherche est remise à zéro pour montrer exactement les actions de la part
      searchQuery = '';
      const input = document.getElementById('searchInput');
      if (input) input.value = '';
      if (taskView !== 'tasks') {
        taskView = 'tasks';
        settings.defaultView = 'tasks';
        saveSettings();
      }
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderCalendar() {
      const cal = document.getElementById('miniCalendar');
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      
      const firstDay = new Date(calYear, calMonth, 1);
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      let startDow = firstDay.getDay();
      if (startDow === 0) startDow = 7; // Lundi = 1
      
      const monthName = firstDay.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      
      // Collect deadlines for this month (only todo tasks), including recurring occurrences
      const deadlineMap = {};
      tasks.forEach(t => {
        if (t.status !== 'todo') return;
        
        if (t.recurrence) {
          // Add all non-completed occurrences for this month
          const occurrences = getRecurrenceOccurrences(t);
          const completedDates = t.completedDates || [];
          const deletedDates = t.deletedDates || [];
          occurrences.forEach(dateStr => {
            if (completedDates.includes(dateStr) || deletedDates.includes(dateStr)) return; // skip completed/deleted
            const d = new Date(dateStr + 'T00:00:00');
            if (d.getFullYear() === calYear && d.getMonth() === calMonth) {
              const day = d.getDate();
              if (!deadlineMap[day]) deadlineMap[day] = [];
              deadlineMap[day].push(t);
            }
          });
        } else if (t.deadline) {
          const d = new Date(t.deadline + 'T00:00:00');
          if (d.getFullYear() === calYear && d.getMonth() === calMonth) {
            const day = d.getDate();
            if (!deadlineMap[day]) deadlineMap[day] = [];
            deadlineMap[day].push(t);
          }
        }
      });
      
      const dows = ['Lu','Ma','Me','Je','Ve','Sa','Di'];
      
      let daysHtml = dows.map(d => `<div class="mini-cal-dow">${d}</div>`).join('');
      
      // Empty cells before first day
      for (let i = 1; i < startDow; i++) {
        daysHtml += '<div class="mini-cal-day empty"></div>';
      }
      
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const isToday = dateStr === todayStr;
        const dayTasks = deadlineMap[day] || [];
        const hasNormal = dayTasks.some(t => t.urgency === 'normal');
        const hasUrgent = dayTasks.some(t => t.urgency === 'urgent');
        const isOverdue = dayTasks.length > 0 && dateStr < todayStr;
        
        let cls = 'mini-cal-day';
        if (isToday) cls += ' today';
        if (dayTasks.length > 0) cls += ' has-task';
        if (isOverdue) {
          cls += ' overdue-day';
        } else {
          if (hasNormal) cls += ' has-normal';
          if (hasUrgent) cls += ' has-urgent';
        }
        
        if (filterDate === dateStr) cls += ' selected';

        let events = '';
        if (dayTasks.length > 0) {
          const titles = dayTasks.map(t => t.title.replace(/'/g, "\\'")).join(', ');
          events = `onclick="filterByDate('${dateStr}')" onmouseenter="showCalTooltip(event, '${titles}')" onmouseleave="hideCalTooltip(event)"`;
        }
        
        daysHtml += `<div class="${cls}" ${events}>${day}</div>`;
      }
      
      cal.innerHTML = `
        <div class="mini-cal-header">
          <div class="mini-cal-title">${monthName}</div>
          <div class="mini-cal-nav">
            <button onclick="changeCalMonth(-1)">${icons.chevronUp.replace('13','10')}</button>
            <button onclick="goToToday()" title="Mois en cours" style="font-size:0.65rem;width:auto;padding:0 6px;">Auj.</button>
            <button onclick="changeCalMonth(1)">${icons.chevronDown.replace('13','10')}</button>
          </div>
        </div>
        <div class="mini-cal-grid">${daysHtml}</div>
        <div class="mini-cal-legend">
          <div class="mini-cal-legend-item"><div class="mini-cal-legend-dot indigo"></div>Aujourd'hui</div>
          <div class="mini-cal-legend-item"><div class="mini-cal-legend-dot green"></div>Normal</div>
          <div class="mini-cal-legend-item"><div class="mini-cal-legend-dot amber"></div>Urgent</div>
          <div class="mini-cal-legend-item"><div class="mini-cal-legend-dot red"></div>En retard</div>
        </div>
      `;
    }

    function filterByDate(dateStr) {
      if (filterDate === dateStr) {
        filterDate = null;
      } else {
        filterDate = dateStr;
        filterPeriod = null;
      }
      render();
    }

    function clearDateFilter() {
      filterDate = null;
      render();
    }

    // ============ FILTRE PAR PÉRIODE (avant / après / entre) ============
    function filterTasksByPeriod(list) {
      if (!filterPeriod) return list;
      return list.filter(t => {
        if (!t.deadline) return false;
        if (filterPeriod.mode === 'before') return t.deadline <= filterPeriod.from;
        if (filterPeriod.mode === 'after') return t.deadline >= filterPeriod.from;
        if (filterPeriod.mode === 'on') return t.deadline === filterPeriod.from;
        if (filterPeriod.mode === 'between') return t.deadline >= filterPeriod.from && t.deadline <= filterPeriod.to;
        return true;
      });
    }

    function getPeriodFilterLabel(fp) {
      const d = ds => formatDate(ds + 'T00:00:00');
      if (fp.mode === 'before') return `Avant le ${d(fp.from)}`;
      if (fp.mode === 'after') return `Après le ${d(fp.from)}`;
      if (fp.mode === 'on') return `Le ${d(fp.from)}`;
      if (fp.mode === 'between') return `Du ${d(fp.from)} au ${d(fp.to)}`;
      return 'Date';
    }

    function openPeriodFilterModal() {
      if (filterPeriod) {
        periodDraft = { ...filterPeriod };
      } else {
        // Pré-remplit avec la date sélectionnée dans le mini-calendrier, si présente
        periodDraft = { mode: 'before', from: filterDate || '', to: '' };
      }
      modalMode = 'period';
      renderModal();
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    function setPeriodDraftMode(mode) {
      periodDraft.mode = mode;
      renderModal();
    }

    function applyPeriodFilter() {
      if (!periodDraft.from) return;
      if (periodDraft.mode === 'between') {
        if (!periodDraft.to) return;
        if (periodDraft.to < periodDraft.from) {
          const tmp = periodDraft.from;
          periodDraft.from = periodDraft.to;
          periodDraft.to = tmp;
        }
      }
      filterPeriod = { ...periodDraft };
      filterDate = null;
      periodDraft = null;
      closeModal();
      render();
    }

    function clearPeriodFilter() {
      filterPeriod = null;
      periodDraft = null;
      closeModal();
      render();
    }

    function goToToday() {
      calYear = new Date().getFullYear();
      calMonth = new Date().getMonth();
      renderCalendar();
    }

    function changeCalMonth(delta) {
      calMonth += delta;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    }

                <button type="button" class="urgency-btn ${currentUrgency === 'normal' ? 'active normal' : ''}" data-urgency="normal" onclick="setUrgency('normal')">
                  ${icons.clock} Normal
                </button>
                <button type="button" class="urgency-btn ${currentUrgency === 'urgent' ? 'active urgent' : ''}" data-urgency="urgent" onclick="setUrgency('urgent')">
                  ${icons.zap} Urgent
                </button>
              </div>
            </div>
          </div>
          ${!isLog ? `
          <label class="recurrence-toggle">
            <input type="checkbox" id="taskRecurring" onchange="toggleRecurrencePanel()">
            ${icons.repeat} Action récurrente
          </label>
          <div class="recurrence-panel hidden" id="recurrencePanel">
            <div class="form-grid">
              <div>
                <label>Date de début <span class="required">*</span></label>
                <input type="date" id="recStartDate" min="${today}">
              </div>
              <div>
                <label>Date de fin <span class="required">*</span></label>
                <input type="date" id="recEndDate" min="${today}">
              </div>
            </div>
            <label style="margin-top:0.5rem;">Jours de récurrence <span class="required">*</span></label>
            <div class="days-grid" id="daysGrid">
              ${DAY_LABELS.map((d, i) => `<button type="button" class="day-btn" data-day="${i}" onclick="toggleDay(this)">${d}</button>`).join('')}
            </div>
          </div>
          ` : ''}
          <div class="form-actions">
            ${isLog
              ? `<button class="btn btn-primary" onclick="logTask()">${icons.check} Consigner</button>`
              : `<button class="btn btn-success" onclick="addTask()">${icons.plus} Ajouter</button>`
            }
            <button class="btn btn-secondary" onclick="collapseForm()">Annuler</button>
          </div>
        </div>
      `;
      
      // Setup contact autocomplete
      const contactInput = document.getElementById('taskContact');
      const suggestionsDiv = document.getElementById('contactSuggestions');
      
      contactInput.addEventListener('input', () => {
        const val = contactInput.value.toLowerCase();
        const filtered = val ? contacts.filter(c => c.toLowerCase().includes(val)) : contacts;
        
        if (filtered.length > 0) {
          suggestionsDiv.innerHTML = filtered.map(c => `
            <div class="suggestion-item" onclick="selectContact('${c.replace(/'/g, "\\'")}')">
              <span>${icons.building} ${c}</span>
            </div>
          `).join('');
          suggestionsDiv.classList.remove('hidden');
        } else {
          suggestionsDiv.classList.add('hidden');
        }
      });
      
      contactInput.addEventListener('focus', () => {
        if (contacts.length > 0) {
          contactInput.dispatchEvent(new Event('input'));
        }
      });
      
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.contact-field')) {
          suggestionsDiv.classList.add('hidden');
        }
      });

      // Suggestions du contact (personne) : filtrées selon l'entreprise saisie
      setupPersonField({
        inputId: 'taskPerson',
        suggestionsId: 'personSuggestions',
        companyGetter: () => document.getElementById('taskContact').value,
      });

      // Setup tag autocomplete
      setupTagInput({
        inputId: 'taskTagInput',
        suggestionsId: 'tagSuggestions',
        chipsId: 'tagsChips',
        fieldSelector: '#tagField',
        list: currentTags,
        removeFnName: 'removeCreateTag',
        addFnName: 'addCreateTagSuggestion',
      });
      
      document.getElementById('taskTitle').focus();
    }

    function renderFilters() {
      const container = document.getElementById('filtersContainer');

      // Barre au-dessus des actions (page Recherche) : filtre « Date »
      // (le bouton Rapport est désormais un carré à côté de Nouvelle action)
      const showDateBtn = taskView === 'tasks';
      document.getElementById('periodFilters').innerHTML = showDateBtn ? `
        <button class="filter-btn ${filterPeriod ? 'active' : ''}" onclick="openPeriodFilterModal()">
          ${icons.calendar} <span>${filterPeriod ? getPeriodFilterLabel(filterPeriod) : 'Date'}</span>
        </button>
      ` : '';
      document.getElementById('periodFilters').classList.toggle('hidden', !showDateBtn);
      document.getElementById('summaryFilters').innerHTML = '';
      document.getElementById('summaryFilters').classList.add('hidden');
      // Tri des comptes (mode Comptes uniquement) : échéance la plus proche ou nom
      const sortSel = document.getElementById('projectSortSelect');
      if (sortSel) {
        sortSel.innerHTML = `
          <option value="deadline" ${projectSort === 'deadline' ? 'selected' : ''}>Trier : Échéance</option>
          <option value="name" ${projectSort === 'name' ? 'selected' : ''}>Trier : Nom</option>
        `;
        sortSel.classList.toggle('hidden', taskView !== 'project');
      }
      // Bouton d'inversion de l'ordre des comptes (croissant / décroissant)
      const projectDirBtn = document.getElementById('projectSortDirBtn');
      if (projectDirBtn) {
        projectDirBtn.innerHTML = projectSortAsc ? icons.sortAsc : icons.sortDesc;
        projectDirBtn.classList.toggle('hidden', taskView !== 'project');
      }
      // Hors Recherche/Comptes, la barre d'outils est masquée
      document.getElementById('taskSortBar')?.classList.toggle('project-mode', taskView !== 'tasks');
      document.getElementById('taskSortBar')?.classList.toggle('hidden', taskView !== 'tasks' && taskView !== 'project');

      // Hors Mode Actions, les filtres de la colonne latérale ne s'appliquent pas
      if (tasks.length === 0 || taskView !== 'tasks') {
        container.classList.add('hidden');
        return;
      }
      container.classList.remove('hidden');
      
      // Base set for dynamic counts : on se base sur les actions "dépliées" par occurrence
      // (comme dans renderTaskList) pour que les compteurs correspondent exactement à ce
      // qui est affiché : une occurrence de récurrence déjà terminée compte dans
      // "Terminées", jamais dans "À faire".
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      let base = filterTasksByPeriod(expandRecurringTasks([...tasks], filterDate || null));
      
      const counts = {
        all: base.length,
        todo: base.filter(t => t.status === 'todo').length,
        done: base.filter(t => t.status === 'done').length,
        late: base.filter(t => t.status === 'todo' && t.deadline && t.deadline < todayStr).length
      };
      
      document.getElementById('statusFilters').innerHTML = `
        <button class="filter-btn ${filterStatus === 'all' && !filterLate ? 'active' : ''}" onclick="filterLate=false;setFilterStatus('all')">
          ${icons.layoutList} <span>Toutes</span> <span class="count">${counts.all}</span>
        </button>
        <button class="filter-btn ${filterStatus === 'todo' && !filterLate ? 'active' : ''}" onclick="filterLate=false;setFilterStatus('todo')">
          ${icons.circle} <span>À faire</span> <span class="count">${counts.todo}</span>
        </button>
        <button class="filter-btn ${filterStatus === 'done' && !filterLate ? 'active' : ''}" onclick="filterLate=false;setFilterStatus('done')">
          ${icons.checkCircle} <span>Terminées</span> <span class="count">${counts.done}</span>
        </button>
        <button class="filter-btn ${filterLate ? 'active' : ''}" onclick="toggleFilterLate()">
          ${icons.alertCircle} <span>En retard</span> <span class="count">${counts.late}</span>
        </button>
      `;

      // Sub-base: apply status/late filter for dynamic counts on category & urgency
      let subBase = [...base];
      if (filterLate) {
        subBase = subBase.filter(t => t.status === 'todo' && t.deadline && t.deadline < todayStr);
      } else if (filterStatus !== 'all') {
        subBase = subBase.filter(t => t.status === filterStatus);
      }

      const catCounts = {
        all: subBase.length,
        pro: subBase.filter(t => (t.category || 'pro') === 'pro').length,
        perso: subBase.filter(t => (t.category || 'pro') === 'perso').length
      };

      const typeCounts = {
        all: subBase.length,
        task: subBase.filter(t => t.type !== 'rdv').length,
        rdv: subBase.filter(t => t.type === 'rdv').length
      };

      // Sub-sub-base: apply category filter for dynamic urgency counts
      let urgBase = [...subBase];
      if (filterCategory !== 'all') {
        urgBase = urgBase.filter(t => (t.category || 'pro') === filterCategory);
      }
      const urgCounts = {
        all: urgBase.length,
        normal: urgBase.filter(t => t.urgency === 'normal').length,
        urgent: urgBase.filter(t => t.urgency === 'urgent').length
      };

      document.getElementById('categoryFilters').innerHTML = `
        <button class="filter-btn ${filterCategory === 'all' ? 'active' : ''}" onclick="setFilterCategory('all')">
          ${icons.tag} <span>Toutes</span> <span class="count">${catCounts.all}</span>
        </button>
        <button class="filter-btn ${filterCategory === 'pro' ? 'active' : ''}" onclick="setFilterCategory('pro')">
          ${icons.briefcase} <span>Pro</span> <span class="count">${catCounts.pro}</span>
        </button>
        <button class="filter-btn ${filterCategory === 'perso' ? 'active' : ''}" onclick="setFilterCategory('perso')">
          ${icons.home} <span>Perso</span> <span class="count">${catCounts.perso}</span>
        </button>
      `;

      document.getElementById('typeFilters').innerHTML = `
        <button class="filter-btn ${filterType === 'all' ? 'active' : ''}" onclick="setFilterType('all')">
          ${icons.circle} <span>Tous</span> <span class="count">${typeCounts.all}</span>
        </button>
        <button class="filter-btn ${filterType === 'task' ? 'active' : ''}" onclick="setFilterType('task')">
          ${icons.listTodo} <span>Tâches</span> <span class="count">${typeCounts.task}</span>
        </button>
        <button class="filter-btn ${filterType === 'rdv' ? 'active' : ''}" onclick="setFilterType('rdv')">
          ${icons.calendarCheck} <span>RDV</span> <span class="count">${typeCounts.rdv}</span>
        </button>
      `;

      document.getElementById('urgencyFilters').innerHTML = `
        <button class="filter-btn ${filterUrgency === 'all' ? 'active' : ''}" onclick="setFilterUrgency('all')">
          ${icons.sparkles} <span>Toutes</span> <span class="count">${urgCounts.all}</span>
        </button>
        <button class="filter-btn ${filterUrgency === 'normal' ? 'active' : ''}" onclick="setFilterUrgency('normal')">
          ${icons.clock} <span>Normal</span> <span class="count">${urgCounts.normal}</span>
        </button>
        <button class="filter-btn ${filterUrgency === 'urgent' ? 'active' : ''}" onclick="setFilterUrgency('urgent')">
          ${icons.zap} <span>Urgent</span> <span class="count">${urgCounts.urgent}</span>
        </button>
      `;
      
      document.getElementById('sortSelect').value = sortBy;
      document.getElementById('sortDirBtn').innerHTML = sortAsc ? icons.sortAsc : icons.sortDesc;
    }

    // Recherche élargie : correspond si le terme apparaît dans le titre, le contact,
    // un tag, la description, l'un des commentaires ou le commentaire de clôture.
    // Pour une occurrence d'action récurrente, seuls les commentaires visibles
    // pour cette occurrence (et ceux sans date d'occurrence) sont pris en compte.
    function taskMatchesQuery(task, q) {
      if (task.title && task.title.toLowerCase().includes(q)) return true;
      if (task.contact && task.contact.toLowerCase().includes(q)) return true;
      if (task.tags && task.tags.some(tag => tag.toLowerCase().includes(q))) return true;
      if (task.description && task.description.toLowerCase().includes(q)) return true;
      if (task.completionComment && task.completionComment.toLowerCase().includes(q)) return true;
      const comments = (task.comments || [])
        .filter(c => !task.recurrence || !c.occurrenceDate || c.occurrenceDate === task.deadline);
      return comments.some(c => c.text && c.text.toLowerCase().includes(q));
    }

    function renderTaskList() {
      const container = document.getElementById('taskListContainer');

      // Page Accueil : le contenu (graphique, actions du jour, boutons) est
      // rendu par renderStats/renderAddTask dans la zone du haut
      if (taskView === 'home') {
        container.innerHTML = '';
        return;
      }

      // Mode Projet : grille par entreprise/contact à la place de la liste
      if (taskView === 'project') {
        renderProjectView();
        return;
      }

      // Mode Projet > fiche contact : vue gestion de projet de ce contact
      if (taskView === 'contact') {
        renderContactProjectView();
        return;
      }

      // Mode Calendrier : emploi du temps des actions
      if (taskView === 'calendar') {
        renderCalendarView();
        return;
      }

      // Expand recurring tasks (show occurrence for filterDate if set, else next)
      let filtered = expandRecurringTasks([...tasks], filterDate || null);
      
      // Search (titre, contact, tags, description, commentaires et commentaire de clôture)
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(t => taskMatchesQuery(t, q));
      }
      
      // Filter by status
      if (filterStatus !== 'all') {
        filtered = filtered.filter(t => t.status === filterStatus);
      }
      
      // Filter by urgency
      if (filterUrgency !== 'all') {
        filtered = filtered.filter(t => t.urgency === filterUrgency);
      }
      
      // Filter by category
      if (filterCategory !== 'all') {
        filtered = filtered.filter(t => (t.category || 'pro') === filterCategory);
      }
      
      // Filter by type (Tâche / Rendez-vous)
      if (filterType === 'task') {
        filtered = filtered.filter(t => t.type !== 'rdv');
      } else if (filterType === 'rdv') {
        filtered = filtered.filter(t => t.type === 'rdv');
      }
      
      // Filter by late
      if (filterLate) {
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        filtered = filtered.filter(t => t.status === 'todo' && t.deadline && t.deadline < todayStr);
      }
      
      // Filter by date (from calendar click)
      if (filterDate) {
        filtered = filtered.filter(t => t.deadline === filterDate);
      }
      
      // Filter by period (avant le / après le / entre le et le)
      filtered = filterTasksByPeriod(filtered);
      
      // Sort
      const urgencyOrder = { urgent: 0, normal: 1 };
      const dir = sortAsc ? 1 : -1;
      filtered.sort((a, b) => {
        // Done at bottom always
        if (a.status === 'done' && b.status !== 'done') return 1;
        if (a.status !== 'done' && b.status === 'done') return -1;
        
        let result = 0;
        switch (sortBy) {
          case 'deadline':
            if (!a.deadline && !b.deadline) result = 0;
            else if (!a.deadline) result = 1;
            else if (!b.deadline) result = -1;
            else result = a.deadline.localeCompare(b.deadline);
            break;
          case 'createdAt':
            result = new Date(a.createdAt) - new Date(b.createdAt);
            break;
          case 'urgency':
            result = urgencyOrder[a.urgency] - urgencyOrder[b.urgency];
            break;
          case 'title':
            result = a.title.localeCompare(b.title, 'fr');
            break;
        }
        // Même clé (ex: même date) : RDV d'abord, puis actions urgentes, puis les autres
        if (result === 0) {
          const typeOrder = (t) => t.type === 'rdv' ? 0 : (t.urgency === 'urgent' ? 1 : 2);
          return typeOrder(a) - typeOrder(b);
        }
        return result * dir;
      });
      
      const hasFilters = filterStatus !== 'all' || filterUrgency !== 'all' || filterCategory !== 'all' || filterType !== 'all' || filterLate || searchQuery.trim() || filterDate || filterPeriod;
      
      // Date filter banner
      const dateBanner = filterDate ? `
        <div class="date-filter-banner">
          ${icons.calendar} Échéances du ${formatDate(filterDate + 'T00:00:00')}
          <button class="date-filter-clear" onclick="clearDateFilter()">✕ Retirer le filtre</button>
        </div>
      ` : '';

      // Period filter banner
      const periodBanner = filterPeriod ? `
        <div class="date-filter-banner">
          ${icons.calendar} Échéances : ${getPeriodFilterLabel(filterPeriod)}
          <button class="date-filter-clear" onclick="clearPeriodFilter()">✕ Retirer le filtre</button>
        </div>
      ` : '';

      if (filtered.length === 0) {
        container.innerHTML = `
          ${dateBanner}
          ${periodBanner}
          <div class="empty-state">
            <div class="empty-icon">${hasFilters ? icons.search : icons.clipboard}</div>
            <h3>${hasFilters ? 'Aucune action trouvée' : 'Aucune action pour le moment'}</h3>
            <p>${hasFilters ? 'Essayez de modifier vos filtres pour voir plus de résultats.' : 'Cliquez sur le bouton ci-dessus pour créer votre première action.'}</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = `
        ${dateBanner}
        ${periodBanner}
        <div class="task-list">
          ${filtered.map(task => renderFicheTaskCard(task)).join('')}
        </div>
      `;
    }

    function renderTaskCard(task) {
      const isDone = task.status === 'done';
      const deadlineInfo = !isDone ? getDeadlineInfo(task.deadline) : null;
      const isOverdue = !isDone && deadlineInfo && deadlineInfo.class === 'overdue';
      // Pour une action récurrente, un commentaire ajouté sur une occurrence donnée
      // (task.deadline = date de l'occurrence affichée) ne doit être visible que sur
      // cette occurrence-là. Les anciens commentaires sans date d'occurrence (créés
      // avant ce correctif) restent affichés partout pour ne pas perdre de données.
      const allComments = task.comments || [];
      const comments = allComments
        .map((c, originalIndex) => ({ ...c, originalIndex }))
        .filter(c => !task.recurrence || !c.occurrenceDate || c.occurrenceDate === task.deadline);
      const commentCount = comments.length;
      
      return `
        <div class="task-card ${isDone ? 'done' : ''} ${isOverdue ? 'overdue' : ''}" id="task-${task.id}">
          <div class="task-stripe ${isDone ? (task.type === 'rdv' ? 'rdv' : 'done') : (isOverdue ? 'overdue' : (task.type === 'rdv' ? 'rdv' : task.urgency))}"></div>
          <div class="task-content">
            <div class="task-header">
              <div style="flex:1;min-width:0;">
                <div class="task-title">${task.title}</div>
                <div class="task-meta">
                  ${task.contact ? `<span class="task-meta-item" style="cursor:pointer;" onclick="openContactSheet('${task.contact.replace(/'/g, "\\'")}')" title="Voir la fiche">${icons.building} ${task.contact}</span>` : ''}
                </div>
                ${(!isDone && deadlineInfo) || task.recurrence ? `
                  <div class="task-meta" style="margin-top:0.25rem;">
                    ${!isDone && deadlineInfo ? `<span class="task-meta-item ${deadlineInfo.class}">${icons.calendar} ${deadlineInfo.text}</span>` : ''}
                    ${task.recurrence ? `<span class="recurrence-badge">${icons.repeat} ${getRecurrenceLabel(task)}${task._remainingCount ? ' · ' + task._remainingCount + ' restante' + (task._remainingCount > 1 ? 's' : '') : ''}</span>` : ''}
                  </div>
                ` : ''}
                <div class="task-meta" style="margin-top:0.25rem;">
                  ${!isDone ? (task.type === 'rdv'
                    ? `<span class="rdv-badge">${icons.calendarCheck} Rendez-vous</span>`
                    : `<span class="urgency-badge ${task.urgency}">${task.urgency === 'urgent' ? icons.zap : icons.clock} ${task.urgency === 'urgent' ? 'Urgent' : 'Normal'}</span>`) : ''}
                  <span class="category-badge ${task.category || 'pro'}">${(task.category || 'pro') === 'pro' ? icons.briefcase + ' Pro' : icons.home + ' Perso'}</span>
                  ${(task.tags || []).map(tag => `<span class="tag-badge" style="cursor:pointer;" onclick="searchByTag('${tag.replace(/'/g, "\\'")}')" title="Filtrer par ce tag">${icons.tag} ${tag}</span>`).join('')}
                </div>
                ${isDone && task.completedAt ? `
                  <div class="task-completed-at">
                    ${icons.calendarCheck} Terminée le ${formatDate(task.completedAt, true)}
                  </div>
                ` : ''}
              </div>
              <button class="delete-btn" onclick="handleDelete('${task.id}', '${task.deadline}', ${!!task.recurrence})" title="Supprimer">${icons.trash}</button>
            </div>
            
            ${task.description ? `
              <div style="margin-top:0.5rem;font-size:0.825rem;color:#64748b;line-height:1.4;${isDone ? 'text-decoration:line-through;opacity:0.6;' : ''}">${task.description}</div>
            ` : ''}
            
            ${isDone && task.completionComment ? `
              <div class="task-comment">
                ${icons.message}
                <p>${task.completionComment}</p>
              </div>
            ` : ''}
            
            <div class="task-actions">
              ${isDone ? `
                <button class="task-action-btn reopen" onclick="reopenTask('${task.id}')">
                  ${icons.rotateCcw} Réouvrir l'action
                </button>
              ` : `
                <button class="task-action-btn edit" onclick="handleEdit('${task.id}', '${task.deadline}', ${!!task.recurrence})">
                  ${icons.pencil} Modifier
                </button>
                <button class="task-action-btn finish" onclick="openCompletionModal('${task.id}', 'terminate', '${task.deadline}')">
                  ${icons.checkCircle} Terminer
                </button>
                <button class="task-action-btn followup" onclick="openCompletionModal('${task.id}', 'followup', '${task.deadline}')">
                  ${icons.refresh} Assurer un suivi
                </button>
              `}
            </div>
            
            <!-- Commentaires -->
            ${commentCount > 0 ? `
              <button class="comments-toggle" onclick="toggleComments('${task.id}')">
                ${icons.msgPlus} Commentaires (${commentCount})
                <span id="comments-chevron-${task.id}">${icons.chevronUp}</span>
              </button>
            ` : `
              <button class="comments-toggle" onclick="toggleComments('${task.id}')">
                ${icons.msgPlus} Ajouter un commentaire
              </button>
            `}
            <div class="comments-section" id="comments-${task.id}">
              ${comments.map((c) => `
                <div class="comment-item">
                  ${icons.message}
                  <div style="flex:1;min-width:0;">
                    <p>${c.text}</p>
                    <div class="comment-date">${formatDate(c.date, true)}</div>
                  </div>
                  <button class="comment-delete" onclick="deleteComment('${task.id}', ${c.originalIndex})" title="Supprimer">${icons.xSmall}</button>
                </div>
              `).join('')}
              <div class="add-comment-row">
                <textarea rows="1" id="comment-input-${task.id}" placeholder="Écrire un commentaire... (Maj+Entrée pour une nouvelle ligne)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addComment('${task.id}', '${task.deadline || ''}')}"></textarea>
                <button class="add-comment-btn" onclick="addComment('${task.id}', '${task.deadline || ''}')">${icons.send}</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ============ COMMENTS ============
    function toggleComments(id) {
      const section = document.getElementById(`comments-${id}`);
      const chevron = document.getElementById(`comments-chevron-${id}`);
      if (section.classList.contains('hidden')) {
        section.classList.remove('hidden');
        if (chevron) chevron.innerHTML = icons.chevronUp;
        // Focus input
        setTimeout(() => {
          const input = document.getElementById(`comment-input-${id}`);
          if (input) input.focus();
        }, 50);
      } else {
        section.classList.add('hidden');
        if (chevron) chevron.innerHTML = icons.chevronDown;
      }
    }

    function addComment(id, occurrenceDate) {
      const input = document.getElementById(`comment-input-${id}`);
      const text = input.value.trim();
      if (!text) return;
      
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      if (!task.comments) task.comments = [];
      const newComment = { text, date: new Date().toISOString() };
      if (task.recurrence && occurrenceDate) newComment.occurrenceDate = occurrenceDate;
      task.comments.push(newComment);
      saveTasks();
      render();
      // Réouvrir la section commentaires
      setTimeout(() => {
        const section = document.getElementById(`comments-${id}`);
        if (section) section.classList.remove('hidden');
        const chevron = document.getElementById(`comments-chevron-${id}`);
        if (chevron) chevron.innerHTML = icons.chevronUp;
      }, 10);
    }

    function deleteComment(id, index) {
      const task = tasks.find(t => t.id === id);
      if (!task || !task.comments) return;
      task.comments.splice(index, 1);
      saveTasks();
      render();
      // Réouvrir la section commentaires

        const days = getSelectedDays();

        if (days.length === 0) { showToast('⚠ Sélectionnez au moins un jour'); return; }

      if (pendingEditTagInput && pendingEditTagInput.value.trim()) {
        addTagsToList(pendingEditTagInput.value, editTags);

      const task = tasks.find(t => t.id === completingTask.id);
      if (task) {
        task.title = title;
        task.contact = contact;
        task.deadline = deadline;
        task.description = description || undefined;
        task.type = editActionType === 'rdv' ? 'rdv' : 'task';

        }

        }
        saveTasks();
      }
      
      closeModal();
      render();
    }

    function reopenTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.status = 'todo';
        task.completionComment = undefined;
        task.completedAt = undefined;
        // Action récurrente entièrement terminée : on rouvre la dernière occurrence
        // complétée, sinon l'action reste "à faire" sans qu'aucune occurrence ne
        // redevienne visible (elle gonflerait le compteur "À faire" sans jamais
        // apparaître dans la liste).
        if (task.recurrence && task.completedDates && task.completedDates.length) {
          let dateToReopen = null;
          if (task.completionLog && task.completionLog.length) {
            dateToReopen = task.completionLog[task.completionLog.length - 1].date;
            task.completionLog = task.completionLog.slice(0, -1);
          } else {
            const deleted = task.deletedDates || [];
            const candidates = task.completedDates.filter(d => !deleted.includes(d)).sort();
            dateToReopen = candidates[candidates.length - 1];
          }
          if (dateToReopen) {
            task.completedDates = task.completedDates.filter(d => d !== dateToReopen);
          }
        }
        saveTasks();
        render();
      }
    }

    // Suggestions d'entreprises dans la barre de recherche : un clic sur un
    // nom ouvre directement la fiche du compte (mode Comptes)
    function refreshSearchSuggestions() {
      const box = document.getElementById('searchSuggestions');
      if (!box) return;
      const q = searchQuery.trim().toLowerCase();
      let contacts;
      let header = '';
      if (!q) {
        // Sans saisie : uniquement les 5 derniers comptes consultés
        const all = getAllContacts();
        contacts = recentContacts.filter(c => all.includes(c)).slice(0, 5);
        if (contacts.length > 0) {
          header = '<div style="padding:0.35rem 0.75rem 0.15rem;font-size:0.62rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;">Derniers comptes consultés</div>';
        }
      } else {
        contacts = getAllContacts().filter(c => c.toLowerCase().includes(q));
      }
      if (contacts.length === 0) {
        box.classList.add('hidden');
        return;
      }
      box.innerHTML = header + contacts.map(c => `
        <div class="suggestion-item" onclick="openContactFromSearch('${c.replace(/'/g, "\\'")}')">
          <span>${icons.building} ${c}</span>
          <span style="color:#94a3b8;font-size:0.7rem;">Compte →</span>
        </div>
      `).join('');
      box.classList.remove('hidden');
    }

    function openContactTasks(contactKey, focusTaskId, focusDate) {
      // Mémorise la page d'origine : le bouton Retour y reviendra

        requestAnimationFrame(() => {
          const el = document.getElementById(`task-${focusTaskId}`);

            el.classList.add('flash-highlight');

    let contactViewOrigin = null; // page d'origine de la fiche consultée

    function backToProjects() {
      const origin = contactViewOrigin;
      projectContact = null;
      renamingContact = false;
      ctFormExpanded = false;
      ctLogMode = false;
      ctTags = [];
      contactViewOrigin = null;
      // Retour à la page d'origine (grille Comptes par défaut ; page de la
      // pop-up si la fiche a été ouverte depuis une pop-up)
      const targetView = (origin && origin.view && origin.view !== 'contact') ? origin.view : 'project';

        requestAnimationFrame(() => {

            .find(c => c.dataset.contactKey === origin.contact);

            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('flash-highlight');
            setTimeout(() => el.classList.remove('flash-highlight'), 1500);
          }
        });
      }
      // Depuis le calendrier : surligne un court instant l'action consultée
      // avant d'aller voir la fiche du compte
      if (targetView === 'calendar' && origin && origin.focusTaskId) {
        requestAnimationFrame(() => {
          const el = document.getElementById(`cal-task-${origin.focusTaskId}-${origin.focusDate || ''}`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('flash-highlight');
            setTimeout(() => el.classList.remove('flash-highlight'), 1500);
          }

    function startRenameContact() {
      renamingContact = true;

    function applyRenameContact() {
      const input = document.getElementById('renameContactInput');
      const newName = input ? input.value.trim() : '';
      if (!newName) { if (input) input.focus(); return; }
      const isNoContact = projectContact === NO_CONTACT_KEY;
      const oldName = projectContact;
      const nameChanged = newName !== (isNoContact ? 'Sans contact' : oldName);

      // Infos du compte (adresse, téléphone, e-mail) : lues depuis le formulaire
      const addrInput = document.getElementById('accountAddress');
      const phoneInput = document.getElementById('accountPhone');
      const emailInput = document.getElementById('accountEmail');
      if (addrInput || phoneInput || emailInput) {
        accountInfo[newName] = {
          address: addrInput ? addrInput.value.trim() : '',
          phone: phoneInput ? phoneInput.value.trim() : '',
          email: emailInput ? emailInput.value.trim() : '',
        };
      }

      if (!nameChanged) {
        saveAccountInfo();
        renamingContact = false;
        render();
        showToast('✓ Compte mis à jour');
        return;
      }

      let count = 0;
      if (isNoContact) {
        // Rattache toutes les actions sans contact au nouveau nom
        tasks.forEach(t => {
          if (!(t.contact || '').trim()) { t.contact = newName; count++; }
        });
      } else {
        // Renomme toutes les actions du contact (insensible à la casse)
        const norm = oldName.trim().toLowerCase();
        tasks.forEach(t => {
          if (t.contact && t.contact.trim().toLowerCase() === norm) { t.contact = newName; count++; }
        });
        // Les contacts du compte suivent le nouveau nom
        contactList.forEach(c => {
          if ((c.account || '').trim().toLowerCase() === norm) c.account = newName;
        });
        saveContacts();
        // Les infos du compte (adresse...) suivent aussi le nouveau nom
        renameAccountInfoKey(oldName, newName);
        // ... puis l édition éventuelle des infos est enregistrée sous ce nom
        if (addrInput || phoneInput || emailInput) {
          accountInfo[newName] = {
            address: addrInput ? addrInput.value.trim() : '',
            phone: phoneInput ? phoneInput.value.trim() : '',
            email: emailInput ? emailInput.value.trim() : '',
          };
        }
      }
      saveAccountInfo();
      saveTasks();
      projectContact = newName;
      renamingContact = false;
      render();
      showToast(`✓ Compte mis à jour — ${count} action${count > 1 ? 's' : ''} reno${count > 1 ? 'mmées' : 'mmée'}`);
    }

    // Supprime le compte affiché et TOUTES ses actions, après confirmation
    function deleteContactAccount() {
      const isNoContact = projectContact === NO_CONTACT_KEY;
      const contactName = isNoContact ? 'Sans contact' : projectContact;
      const norm = (projectContact || '').trim().toLowerCase();
      const related = tasks.filter(t => isNoContact
        ? !(t.contact || '').trim()
        : (t.contact && t.contact.trim().toLowerCase() === norm));
      if (!confirm(`Supprimer « ${contactName} » ?\n\n${related.length} action${related.length > 1 ? 's' : ''} associée${related.length > 1 ? 's' : ''} ${related.length > 1 ? 'seront supprimées' : 'sera supprimée'} définitivement.`)) {
        return;
      }
      tasks = tasks.filter(t => isNoContact
        ? (t.contact || '').trim()
        : !(t.contact && t.contact.trim().toLowerCase() === norm));
      // Les contacts et les infos (adresse...) du compte sont supprimés avec lui
      contactList = isNoContact ? contactList : contactList.filter(c => (c.account || '').trim().toLowerCase() !== norm);
      saveContacts();
      if (!isNoContact) {
        const infoKey = Object.keys(accountInfo).find(k => k.toLowerCase() === norm);
        if (infoKey) { delete accountInfo[infoKey]; saveAccountInfo(); }
      }
      saveTasks();
      showToast(`✓ ${contactName} supprimé (${related.length} action${related.length > 1 ? 's' : ''})`);
      backToProjects();
    }

    // Crée une action pour le contact de la fiche en cours
    function addCtTask() {
      const title = document.getElementById('ctTitle').value.trim();
      const description = document.getElementById('ctDescription').value.trim();
      const isRecurring = document.getElementById('ctRecurring')?.checked;

      let deadline = '';
      if (!isRecurring) {
        deadline = document.getElementById('ctDeadline').value;
        if (!deadline) { document.getElementById('ctDeadline').focus(); return; }
      }

      let recurrence = null;
      if (isRecurring) {
        const startDate = document.getElementById('ctRecStart').value;
        const endDate = document.getElementById('ctRecEnd').value;
        const days = getCtSelectedDays();
        if (!startDate) { document.getElementById('ctRecStart').focus(); return; }
        if (!endDate) { document.getElementById('ctRecEnd').focus(); return; }
        if (days.length === 0) { showToast('⚠ Sélectionnez au moins un jour'); return; }
        recurrence = { startDate, endDate, days };
        deadline = startDate; // la date de début sert d'échéance (comme le formulaire classique)
      }

      // Récupère le tag éventuellement encore tapé (non validé par Entrée)
      const pendingTagInput = document.getElementById('ctTagInput');
      if (pendingTagInput && pendingTagInput.value.trim()) {
        addTagsToList(pendingTagInput.value, ctTags);
      }
      const ctAccount = projectContact === NO_CONTACT_KEY ? '' : projectContact;
      const task = {
        id: generateId(),
        title,
        contact: ctAccount,
        deadline,
        description: description || undefined,
        type: ctActionType === 'rdv' ? 'rdv' : 'task',
        urgency: ctActionType === 'rdv' ? 'normal' : ctUrgency,
        category: ctCategory,
        status: 'todo',
        createdAt: new Date().toISOString(),
        tags: [...ctTags],
        ...(resolvePerson(ctAccount, document.getElementById('ctPerson') ? document.getElementById('ctPerson').value : '') || {}),
      };
      if (recurrence) task.recurrence = recurrence;
      tasks.unshift(task);
      saveTasks();
      ctFormExpanded = false;
      ctTags = [];
      ctUrgency = settings.defaultUrgency;
      ctActionType = 'task';
      ctCategory = settings.defaultCategory;
      render();
      showToast('✓ Action ajoutée');
    }

    // ---- Fiche contact : vue gestion de projet ----
    function renderContactProjectView() {
      const container = document.getElementById('taskListContainer');
      const isNoContact = projectContact === NO_CONTACT_KEY;
      const contactName = isNoContact ? 'Sans contact' : (projectContact || '');
      const norm = (projectContact || '').trim().toLowerCase();
      const todayStr = getTodayStr();
      const today = new Date().toISOString().split('T')[0];

      // Actions du contact (occurrences récurrentes dépliées comme en Mode Actions)
      const expanded = expandRecurringTasks([...tasks], null).filter(t => {
        const c = (t.contact || '').trim().toLowerCase();
        return isNoContact ? c === '' : c === norm;
      });

      let todo = expanded.filter(t => t.status !== 'done');
      let done = expanded.filter(t => t.status === 'done');

      // La recherche s'applique aussi dans la fiche contact
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        const matches = t => taskMatchesQuery(t, q);
        todo = todo.filter(matches);
        done = done.filter(matches);
      }

      todo.sort((a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999'));
      done.sort((a, b) => new Date(b.completedAt || 0) - new Date(a.completedAt || 0));

      const overdueCount = todo.filter(t => t.deadline && t.deadline < todayStr).length;

    // ---- Mode Calendrier : emploi du temps des actions ----
    // (actions à faire uniquement, occurrences récurrentes restantes incluses)
    function getCalendarTaskMap() {
      const map = {};
      const push = (date, item) => {
        if (!date) return;
        if (!map[date]) map[date] = [];
        map[date].push(Object.assign({ date: date }, item));
      };
      tasks.forEach(t => {
        // Le calendrier n'affiche que les actions à faire :
        // actions terminées et occurrences récurrentes complétées exclues
        if (t.recurrence && t.recurrence.startDate && t.recurrence.endDate) {
          const excluded = (t.completedDates || []).concat(t.deletedDates || []);
          getRecurrenceOccurrences(t).forEach(date => {
            if (excluded.includes(date)) return;
            push(date, { title: t.title, contact: t.contact, status: 'todo', urgency: t.urgency, type: t.type, id: t.id, recurring: true });
          });
        } else if (t.deadline && t.status !== 'done') {
          push(t.deadline, { title: t.title, contact: t.contact, status: 'todo', urgency: t.urgency, type: t.type, id: t.id });
        }
      });
      // Dans chaque jour : RDV d'abord, puis actions urgentes, puis les autres
      const order = t => t.type === 'rdv' ? 0 : (t.status === 'done' ? 3 : (t.urgency === 'urgent' ? 1 : 2));
      Object.keys(map).forEach(d => map[d].sort((a, b) => order(a) - order(b) || a.title.localeCompare(b.title, 'fr')));
      return map;
    }

    function startOfWeek(date) {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const dow = d.getDay();
      d.setDate(d.getDate() + (dow === 0 ? -6 : 1 - dow));
      return d;
    }

    function isoDate(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    // Élément d'action (même présentation que les listes de l Accueil) ;
    // un clic ouvre la fiche du compte concerné
    function renderCalTask(t) {
      // Action en retard (date passée, non terminée) : point rouge
      const todayStr = getTodayStr();
      const isOverdue = t.status !== 'done' && t.date && t.date < todayStr;
      const dot = t.status === 'done' ? '#94a3b8' : (isOverdue ? '#dc2626' : (t.type === 'rdv' ? '#2563eb' : (t.urgency === 'urgent' ? '#f59e0b' : '#10b981')));
      const when = t.status === 'done' ? '✓' : (isOverdue ? 'Retard' : (t.type === 'rdv' ? 'RDV' : (t.urgency === 'urgent' ? 'Urgent' : '')));
      const clickAttr = ` onclick="event.stopPropagation();openTaskDetail('${t.id}', '${t.date}')" title="Consulter l'action"`;
      const dragAttr = !t.recurring ? ` draggable="true" ondragstart="calDragTask(event, '${t.id}')"` : '';
      return `<button class="mini-task-item cal-task" id="cal-task-${t.id}-${t.date}"${clickAttr}${dragAttr}>
        <span class="dot" style="background:${dot}"></span>
        <span class="txt">${t.title}</span>
        ${t.recurring ? `<span class="cal-rec-logo" title="Action récurrente">${icons.repeat}</span>` : ''}
        ${when ? `<span class="when">${when}</span>` : ''}
      </button>`;
    }

    function calNav(dir) {
      const d = new Date(calMainDate);
      if (calendarMode === 'year') d.setFullYear(d.getFullYear() + dir);
      else if (calendarMode === 'month') d.setMonth(d.getMonth() + dir);
      else d.setDate(d.getDate() + 7 * dir);
      calMainDate = d;
      render();
    }

    function calGoToday() {
      calMainDate = new Date();
      render();
    }

    function setCalendarMode(mode) {
      calendarMode = mode;
      settings.defaultCalendarMode = mode;
      saveSettings();
      render();
    }

    // Clic sur un jour (vue Année) : ouvre ce mois en vue Mois.
    // Clic sur un jour (vue Mois) : ouvre cette date en vue Semaine.
    // (Navigation pure : la vue par défaut des Paramètres n'est pas modifiée)
    function calJumpToDate(dateStr) {
      const p = dateStr.split('-');
      calMainDate = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
      calendarMode = 'month';
      render();
    }

    function calJumpToWeek(dateStr) {
      const p = dateStr.split('-');
      calMainDate = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
      calendarMode = 'week';
      render();
    }

    function getCalendarLabel() {
      if (calendarMode === 'year') return String(calMainDate.getFullYear());
      if (calendarMode === 'month') return calMainDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      const start = startOfWeek(calMainDate);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      const f = d => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
      return `Du ${f(start)} au ${f(end)} ${end.getFullYear()}`;
    }

    function renderCalendarView() {
      const container = document.getElementById('taskListContainer');
      if (tasks.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${icons.clipboard}</div>
            <h3>Aucune action pour le moment</h3>
            <p>Cliquez sur le bouton ci-dessus pour créer votre première action.</p>
          </div>
        `;
        return;
      }
      const header = `
        <div class="cal-toolbar">
          <div class="cal-nav">
            <button onclick="calNav(-1)" title="Précédent">‹</button>
            <button class="cal-today-btn" onclick="calGoToday()">Aujourd'hui</button>
            <button onclick="calNav(1)" title="Suivant">›</button>
          </div>
          <div class="cal-title">${getCalendarLabel()}</div>
          <div class="cal-view-btns">
            <button class="cal-view-btn ${calendarMode === 'year' ? 'active' : ''}" onclick="setCalendarMode('year')">Année</button>
            <button class="cal-view-btn ${calendarMode === 'month' ? 'active' : ''}" onclick="setCalendarMode('month')">Mois</button>
            <button class="cal-view-btn ${calendarMode === 'week' ? 'active' : ''}" onclick="setCalendarMode('week')">Semaine</button>
            <button class="cal-view-btn ${calendarMode === 'workweek' ? 'active' : ''}" onclick="setCalendarMode('workweek')">Semaine travail</button>
          </div>
        </div>`;
      let body = '';
      if (calendarMode === 'year') body = renderCalYear();
      else if (calendarMode === 'month') body = renderCalMonth();
      else body = renderCalWeek(calendarMode === 'workweek');
      container.innerHTML = header + body;
    }

    // Cellule d'un jour de la vue Mois ; les jours des mois adjacents
    // (début/fin de grille) sont affichés en atténué mais restent cliquables
    // (actions visibles, clic, glisser-déposer)
    function calMonthCell(d, map, todayStr, muted) {
      const dateStr = isoDate(d);
      const items = map[dateStr] || [];
      return `
        <div class="cal-cell ${muted ? 'cal-muted' : ''}${dateStr === todayStr ? ' today' : ''}" onclick="calJumpToWeek('${dateStr}')" title="Voir cette semaine" ondragover="calAllowDrop(event, this)" ondragleave="calDragLeave(event, this)" ondrop="calDropTask(event, '${dateStr}')">
          <div class="cal-day-num">${d.getDate()}</div>
          <div class="cal-tasks">${items.map(renderCalTask).join('')}</div>
        </div>`;
    }

    function renderCalMonth() {
      const year = calMainDate.getFullYear();
      const month = calMainDate.getMonth();
      const first = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      let startDow = first.getDay();
      if (startDow === 0) startDow = 7;
      const map = getCalendarTaskMap();
      const todayStr = getTodayStr();
      let html = '<div class="cal-scroll"><div class="cal-month-grid">';
      html += ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Di'].map(d => `<div class="cal-dow-head">${d}</div>`).join('');
      // Derniers jours du mois précédent (s'il y en a dans la grille)
      for (let i = startDow - 1; i >= 1; i--) {
        html += calMonthCell(new Date(year, month, 1 - i), map, todayStr, true);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        html += calMonthCell(new Date(year, month, day), map, todayStr, false);
      }
      // Premiers jours du mois suivant (s'il y en a dans la grille)
      const trailing = (7 - ((startDow - 1 + daysInMonth) % 7)) % 7;
      for (let i = 1; i <= trailing; i++) {
        html += calMonthCell(new Date(year, month, daysInMonth + i), map, todayStr, true);
      }
      html += '</div></div>';
      return html;
    }

    function renderCalWeek(workweek) {
      const days = workweek ? 5 : 7;
      const start = startOfWeek(calMainDate);
      const map = getCalendarTaskMap();
      const todayStr = getTodayStr();
      let cols = '';
      for (let i = 0; i < days; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        const dateStr = isoDate(d);
        const items = map[dateStr] || [];
        cols += `
          <div class="cal-week-col" ondragover="calAllowDrop(event, this)" ondragleave="calDragLeave(event, this)" ondrop="calDropTask(event, '${dateStr}')">
            <div class="cal-week-head ${dateStr === todayStr ? 'today' : ''}">
              <span class="cal-week-day-label">${d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'short' })}</span>
              <button class="cal-add-day-btn" onclick="openQuickAddModal('${dateStr}')" title="Nouvelle action le ${dateStr}">+</button>
            </div>
            <div class="cal-tasks">${items.length ? items.map(renderCalTask).join('') : '<div class="cal-empty-day">Aucune action</div>'}</div>
          </div>`;
      }
      return `<div class="cal-scroll"><div class="cal-week-grid" style="grid-template-columns:repeat(${days},1fr);min-width:${days * 130}px;">${cols}</div></div>`;
    }

    function renderCalYear() {
      const year = calMainDate.getFullYear();
      const map = getCalendarTaskMap();
      const todayStr = getTodayStr();
      let months = '';
      for (let m = 0; m < 12; m++) {
        const first = new Date(year, m, 1);
        const daysInMonth = new Date(year, m + 1, 0).getDate();
        let startDow = first.getDay();
        if (startDow === 0) startDow = 7;
        let cells = ['Lu', 'Ma', 'Me', 'Je', 'Ve', 'Sa', 'Di'].map(d => `<div class="mini-cal-dow">${d}</div>`).join('');
        for (let i = 1; i < startDow; i++) cells += '<div class="mini-cal-day empty"></div>';
        for (let day = 1; day <= daysInMonth; day++) {
          const dateStr = year + '-' + String(m + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
          const items = map[dateStr] || [];
          const hasTodo = items.some(t => t.status !== 'done');
          const hasUrgent = items.some(t => t.status !== 'done' && t.urgency === 'urgent');
          let cls = 'mini-cal-day';
          if (dateStr === todayStr) cls += ' today';
          if (hasTodo && dateStr < todayStr) cls += ' overdue-day';
          else if (hasUrgent) cls += ' has-urgent';
          else if (hasTodo) cls += ' has-normal';
          else if (items.length) cls += ' has-done';
          cells += `<div class="${cls}" onclick="calJumpToDate('${dateStr}')" title="${items.length} action${items.length > 1 ? 's' : ''}" style="cursor:pointer;">${day}</div>`;
        }
        months += `
          <div class="cal-year-month">
            <div class="cal-year-title" onclick="calJumpToDate('${year}-${String(m + 1).padStart(2, '0')}-01')" title="Voir ce mois">${first.toLocaleDateString('fr-FR', { month: 'long' })}</div>
            <div class="mini-cal-grid">${cells}</div>
          </div>`;
      }
      return `<div class="cal-year-grid">${months}</div>`;
    }

    // ---- Mode Projet : grille de cartes par entreprise/contact ----
    function renderProjectView() {
      const container = document.getElementById('taskListContainer');

      if (tasks.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${icons.clipboard}</div>
            <h3>Aucune action pour le moment</h3>
            <p>Cliquez sur le bouton ci-dessus pour créer votre première action.</p>
          </div>
        `;
        return;
      }

      const todayStr = getTodayStr();

      // Compte les actions à faire par contact (occurrences récurrentes incluses,
      // comme en Mode Actions, pour rester cohérent avec les compteurs de filtres)
      const expanded = expandRecurringTasks([...tasks], null);
      const map = new Map();
      const ensure = (key, displayName, isNoContact) => {
        if (!map.has(key)) map.set(key, { key, name: displayName, noContact: !!isNoContact, todo: 0, overdue: 0, urgent: 0, nextDeadline: null, nextTaskTitle: '', nextTaskUrgency: 'normal' });
        return map.get(key);
      };
      // Tous les contacts connus, même sans action en cours
      tasks.forEach(t => {
        const k = (t.contact || '').trim();
        if (k) ensure(k, k, false);
      });
      // Actions sans contact (données importées) regroupées sous une carte dédiée
      if (tasks.some(t => !(t.contact || '').trim())) ensure(NO_CONTACT_KEY, 'Sans contact', true);
      // Comptage des actions à faire
      expanded.forEach(t => {
        if (t.status !== 'todo') return;
        const k = (t.contact || '').trim() || NO_CONTACT_KEY;
        const c = map.get(k);
        if (!c) return;
        c.todo++;
        if (t.urgency === 'urgent') c.urgent++;
        if (t.deadline) {
          if (t.deadline < todayStr) c.overdue++;
          if (!c.nextDeadline || t.deadline < c.nextDeadline) {
            c.nextDeadline = t.deadline;
            c.nextTaskTitle = t.title;
            c.nextTaskUrgency = t.urgency;
          }
        }
      });

      const cards = Array.from(map.values());
      const dir = projectSortAsc ? 1 : -1;
      let list;
      if (projectSort === 'name') {
        // Tri alphabétique : tous les comptes, actifs et inactifs mélangés
        list = [...cards].sort((a, b) => a.name.localeCompare(b.name, 'fr') * dir);
      } else {
        // Tri par échéance : l'action à faire la plus proche de chaque compte,
        // comptes actifs d'abord, puis sans action en cours (quel que soit le sens)
        const active = cards.filter(c => c.todo > 0).sort((a, b) => {
          const da = a.nextDeadline || '9999-12-31';
          const db = b.nextDeadline || '9999-12-31';
          if (da !== db) {
            // les comptes sans échéance restent en fin de liste dans les deux sens
            if (da === '9999-12-31') return 1;
            if (db === '9999-12-31') return -1;
            return (da < db ? -1 : 1) * dir;
          }
          return a.name.localeCompare(b.name, 'fr');
        });
        const inactive = cards.filter(c => c.todo === 0).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
        list = [...active, ...inactive];
      }

      // La recherche filtre les cartes par nom d'entreprise/contact
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        list = list.filter(c => c.name.toLowerCase().includes(q));
      }

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${icons.search}</div>
            <h3>Aucune entreprise/contact trouvé</h3>
            <p>Essayez de modifier votre recherche pour voir plus de résultats.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="project-grid">
          ${list.map(c => {
            const dl = c.nextDeadline ? getDeadlineInfo(c.nextDeadline) : null;
            return `
            <button class="project-card ${c.todo > 0 ? '' : 'inactive'}" data-contact-key="${c.key.replace(/"/g, '&quot;')}" onclick="openContactTasks('${c.key.replace(/'/g, "\\'")}')" title="Voir les actions de ${c.name.replace(/"/g, '&quot;')}">
              <div class="project-card-name">${c.noContact ? icons.tag : icons.building}<span class="project-card-name-txt">${c.name}</span><span class="project-card-go">›</span></div>
              ${c.todo > 0 && c.nextTaskTitle ? `
                <div class="project-card-next">
                  <div class="project-card-next-label">Prochaine action</div>
                  <div class="project-card-next-title">${c.nextTaskTitle}</div>
                  <div class="project-card-next-date ${dl ? dl.class : ''}">${icons.calendar} ${dl ? dl.text : ''}${c.nextTaskUrgency === 'urgent' ? ' · urgent' : ''}</div>
                </div>` : ''}
              <div class="project-card-stats">
                ${c.todo > 0 ? `
                  <span class="project-stat">${c.todo} à faire</span>
                  ${c.urgent > 0 ? `<span class="project-stat urgent">${c.urgent} urgent${c.urgent > 1 ? 'es' : ''}</span>` : ''}
                  ${c.overdue > 0 ? `<span class="project-stat overdue">${c.overdue} en retard</span>` : ''}
                ` : `<span class="project-stat ok">Aucune action en cours</span>`}
              </div>
            </button>
          `;}).join('')}
        </div>
      `;
    }

    function savePersonForm() {
      const name = document.getElementById('personName').value.trim();
      const role = document.getElementById('personRole').value.trim();
      const phone = document.getElementById('personPhone').value.trim();
      const email = document.getElementById('personEmail').value.trim();
      if (!name) { document.getElementById('personName').focus(); return; }
      const account = projectContact === NO_CONTACT_KEY ? '' : (projectContact || '');
      if (personFormState && personFormState.id) {
        const c = contactList.find(p => p.id === personFormState.id);
        if (c) {
          const oldName = c.name;
          c.name = name;
          c.role = role || undefined;
          c.phone = phone || undefined;
          c.email = email || undefined;
          // Renommage : le nom affiché sur les actions suit
          if (oldName !== name) {
            tasks.forEach(t => { if (t.personId === c.id) t.person = name; });
            saveTasks();
          }
          showToast('✓ Contact modifié');
        }
      } else {
        contactList.push({
          id: generateId(),
          account: account,
          name: name,
          role: role || undefined,
          phone: phone || undefined,
          email: email || undefined,
        });
        showToast('✓ Contact ajouté');

      saveContacts();
      personFormState = null;
      closeModal();
      render();

    function openTaskDetail(id, dateStr) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      detailTask = JSON.parse(JSON.stringify(task));
      detailTask._date = dateStr || task.deadline;
      completingTask = null;
      viewingContact = null;
      modalMode = 'taskDetail';
      renderModal();
      document.getElementById('modalOverlay').classList.remove('hidden');

    // Rafraîchit la pop-up d'action (calendrier) avec les données à jour
    function refreshTaskDetail(id, dateStr) {
      const task = tasks.find(t => t.id === id);
      if (!task) { closeModal(); return; }
      detailTask = JSON.parse(JSON.stringify(task));
      detailTask._date = dateStr || task.deadline;
      renderModal();
    }

    // Ajout d'un commentaire depuis la pop-up d'action (calendrier) :
    // même logique que addComment, puis la pop-up est rafraîchie
    function addDetailComment(id, occurrenceDate) {
      if (occurrenceDate === 'undefined' || occurrenceDate === 'null') occurrenceDate = '';
      const input = document.getElementById('detailCommentInput');
      const text = input ? input.value.trim() : '';
      if (!text) return;
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      if (!task.comments) task.comments = [];
      const newComment = { text, date: new Date().toISOString() };
      if (task.recurrence && occurrenceDate) newComment.occurrenceDate = occurrenceDate;
      task.comments.push(newComment);
      saveTasks();
      render();
      refreshTaskDetail(id, occurrenceDate || task.deadline);
      // Le focus revient sur le champ pour enchaîner plusieurs commentaires
      setTimeout(() => document.getElementById('detailCommentInput')?.focus(), 50);
    }

    // Réouverture d'une action depuis la pop-up (calendrier) ; pour une action
    // récurrente, c'est l'occurrence consultée qui est rouverte spécifiquement
    function reopenTaskOccurrence(id, dateStr) {
      const task = tasks.find(t => t.id === id);
      if (!task) { closeModal(); return; }
      if (task.recurrence && dateStr && (task.completedDates || []).includes(dateStr)) {
        task.completedDates = task.completedDates.filter(d => d !== dateStr);
        if (task.completionLog) task.completionLog = task.completionLog.filter(e => e.date !== dateStr);
        if (task.status === 'done') {
          task.status = 'todo';
          task.completionComment = undefined;
          task.completedAt = undefined;
        }
        saveTasks();
        render();
        refreshTaskDetail(id, dateStr);
      } else {
        reopenTask(id);
        refreshTaskDetail(id, dateStr);
      }
    }
