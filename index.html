            <label>${icons.message} Commentaire de clôture</label>
            <textarea id="completionComment" placeholder="Résultat, notes sur l'action actuelle..." style="min-height:80px;"></textarea>
            
            <div class="divider"><span>Nouvelle action de suivi</span></div>
            
            <label>Type</label>
            <div class="type-buttons">
              <button type="button" class="type-btn ${followUpType === 'task' ? 'active task' : ''}" data-type="task" onclick="setFollowUpType('task')">${icons.listTodo} Tâche</button>
              <button type="button" class="type-btn ${followUpType === 'rdv' ? 'active rdv' : ''}" data-type="rdv" onclick="setFollowUpType('rdv')">${icons.calendarCheck} Rendez-vous</button>
            </div>

            <label style="margin-top:0.75rem;">Titre <span class="required">*</span></label>
            <input type="text" id="followUpTitle" placeholder="Ex: Relancer le client...">

            <label style="margin-top:0.75rem;">${icons.user} Contact du compte (optionnel)</label>
            <div class="contact-field">
              ${icons.user}
              <input type="text" id="followUpPerson" placeholder="Personne à assigner à l'action..." autocomplete="off">
              <div class="suggestions hidden" id="followUpPersonSuggestions"></div>
            </div>

            <label style="margin-top:0.75rem;">Description</label>
            <textarea id="followUpDescription" placeholder="Détails, contexte, instructions..." rows="2" style="resize:vertical;"></textarea>

            <label style="margin-top:0.75rem;">${icons.tag} Tags (optionnel)</label>
            <div class="tag-field" id="followUpTagField">
              <div class="tags-chips" id="followUpTagsChips"></div>
              <input type="text" id="followUpTagInput" placeholder="Ajouter un tag et appuyer sur Entrée..." autocomplete="off">
              <div class="suggestions hidden" id="followUpTagSuggestions"></div>
            </div>
            
            <div class="form-row" style="margin-top:0.75rem;">
              <div>
                <label>${icons.calendar} Date limite <span class="required">*</span></label>
                <input type="date" id="followUpDeadline" min="${today}" required>
              </div>
              <div id="followUpUrgencyField" class="${followUpType === 'rdv' ? 'hidden' : ''}">
                <label>Urgence</label>
                <div class="urgency-buttons" style="margin-top:0;">
                  <button type="button" class="urgency-btn active normal" data-urgency="normal" onclick="setFollowUpUrgency('normal')">${icons.clock}</button>
                  <button type="button" class="urgency-btn" data-urgency="urgent" onclick="setFollowUpUrgency('urgent')">${icons.zap}</button>
                </div>
              </div>
            </div>
            
            ${task.contact ? `<div class="modal-note" style="margin-top:0.75rem;">Le contact <strong>« ${task.contact} »</strong> sera repris dans la nouvelle action.</div>` : ''}
            
            <div class="modal-actions">
              <button class="btn btn-blue" onclick="createFollowUp()">${icons.refresh} Terminer et créer le suivi</button>
              <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
            </div>
          </div>
        `;
        setupPersonField({
          inputId: 'followUpPerson',
          suggestionsId: 'followUpPersonSuggestions',
          companyGetter: () => (task.contact || ''),
        });
        setupTagInput({
          inputId: 'followUpTagInput',
          suggestionsId: 'followUpTagSuggestions',
          chipsId: 'followUpTagsChips',
          fieldSelector: '#followUpTagField',
          list: followUpTags,
          removeFnName: 'removeFollowUpTag',
          addFnName: 'addFollowUpTagSuggestion',
        });
        setTimeout(() => document.getElementById('completionComment')?.focus(), 100);
      }
    }

    let followUpUrgency = 'normal';
    let followUpType = 'task';
    function setFollowUpType(type) {
      followUpType = type;
      // Le tag « RDV » est géré automatiquement avec le type Rendez-vous
      const idx = followUpTags.indexOf('RDV');
      if (type === 'rdv' && idx === -1) followUpTags.push('RDV');
      if (type === 'task' && idx !== -1) followUpTags.splice(idx, 1);
      document.querySelectorAll('.modal .type-btn').forEach(btn => {
        btn.classList.remove('active', 'task', 'rdv');
        if (btn.dataset.type === type) btn.classList.add('active', type);
      });
      // Un rendez-vous n'a pas de niveau d'urgence
      const urgField = document.getElementById('followUpUrgencyField');
      if (urgField) urgField.classList.toggle('hidden', type === 'rdv');
      renderTagsChips('followUpTagsChips', followUpTags, 'removeFollowUpTag');
    }
    function setFollowUpUrgency(urgency) {
      followUpUrgency = urgency;
      document.querySelectorAll('.modal .urgency-btn').forEach(btn => {
        btn.classList.remove('active', 'normal', 'urgent');
        if (btn.dataset.urgency === urgency) {
          btn.classList.add('active', urgency);
        }
      });
    }

    // Tags du formulaire de suivi : pré-remplis depuis l'action d'origine,
    // puis librement modifiables (suppression d'une puce ou ajout)
    let followUpTags = [];
    function removeFollowUpTag(i) {
      followUpTags.splice(i, 1);
      renderTagsChips('followUpTagsChips', followUpTags, 'removeFollowUpTag');
    }
    function addFollowUpTagSuggestion(tag) {
      addTagsToList(tag, followUpTags);
      const input = document.getElementById('followUpTagInput');
      if (input) { input.value = ''; input.focus(); }
      renderTagsChips('followUpTagsChips', followUpTags, 'removeFollowUpTag');
      document.getElementById('followUpTagSuggestions')?.classList.add('hidden');
    }

    function terminateTask() {
      const comment = document.getElementById('completionComment').value.trim();
      const now = new Date().toISOString();
      
      const task = tasks.find(t => t.id === completingTask.id);
      if (task) {
        if (task.recurrence) {
          // Recurring: mark only the current occurrence date as completed
          if (!task.completedDates) task.completedDates = [];
          // The displayed deadline is the current occurrence date
          const currentDate = completingTask._displayDeadline || completingTask.deadline;
          if (currentDate && !task.completedDates.includes(currentDate)) {
            task.completedDates.push(currentDate);
          }
          // Store completion comment for this date
          if (!task.completionLog) task.completionLog = [];
          if (comment) {
            task.completionLog.push({ date: currentDate, comment, completedAt: now });
          }
          
          // Check if ALL occurrences are now completed
          const allOccurrences = getRecurrenceOccurrences(task);
          const remaining = allOccurrences.filter(d => !task.completedDates.includes(d));
          if (remaining.length === 0) {
            task.status = 'done';
            task.completionComment = comment || undefined;
            task.completedAt = now;
          }
        } else {
          task.status = 'done';
          task.completionComment = comment || undefined;
          task.completedAt = now;
        }
        saveTasks();
      }
      
      closeModal();
      render();
    }

    function createFollowUp() {
      const comment = document.getElementById('completionComment').value.trim();
      const title = document.getElementById('followUpTitle').value.trim();
      const description = document.getElementById('followUpDescription')?.value.trim();
      const deadline = document.getElementById('followUpDeadline').value;
      
      if (!title) { document.getElementById('followUpTitle').focus(); return; }
      if (!deadline) { document.getElementById('followUpDeadline').focus(); return; }
      
      // Récupère le tag éventuellement encore tapé (non validé par Entrée) dans le champ
      const pendingFollowUpTagInput = document.getElementById('followUpTagInput');
      if (pendingFollowUpTagInput && pendingFollowUpTagInput.value.trim()) {
        addTagsToList(pendingFollowUpTagInput.value, followUpTags);
      }

      const now = new Date().toISOString();

      // L'historique des commentaires de clôture suit la chaîne d'actions de suivi :
      // on reprend celui de l'action qui se termine et on y ajoute sa clôture
      const carriedHistory = [...(completingTask.history || [])];
      if (comment) carriedHistory.push({ text: comment, date: now });
      
      // Complete current task (or current occurrence if recurring)
      const task = tasks.find(t => t.id === completingTask.id);
      if (task) {
        if (task.recurrence) {
          if (!task.completedDates) task.completedDates = [];
          const currentDate = completingTask._displayDeadline || completingTask.deadline;
          if (currentDate && !task.completedDates.includes(currentDate)) {
            task.completedDates.push(currentDate);
          }
          if (!task.completionLog) task.completionLog = [];
          if (comment) {
            task.completionLog.push({ date: currentDate, comment, completedAt: now });
          }
          const allOccurrences = getRecurrenceOccurrences(task);
          const remaining = allOccurrences.filter(d => !task.completedDates.includes(d));
          if (remaining.length === 0) {
            task.status = 'done';
            task.completionComment = comment || undefined;
            task.completedAt = now;
          }
        } else {
          task.status = 'done';
          task.completionComment = comment || undefined;
          task.completedAt = now;
        }
      }
      
      // Create follow-up task
      const newTask = {
        id: generateId(),
        title,
        contact: completingTask.contact,
        deadline,
        description: description || undefined,
        type: followUpType === 'rdv' ? 'rdv' : 'task',
        urgency: followUpType === 'rdv' ? 'normal' : followUpUrgency,
        category: completingTask.category || 'pro',
        status: 'todo',
        createdAt: now,
        tags: [...followUpTags],
        history: carriedHistory.length ? carriedHistory : undefined,
        ...(resolvePerson(completingTask.contact, document.getElementById('followUpPerson') ? document.getElementById('followUpPerson').value : '') || {}),
      };
      
      tasks.unshift(newTask);
      saveTasks();
      followUpUrgency = 'normal';
      followUpType = 'task';
      followUpTags = [];
      
      closeModal();
      render();
    }

    // Close modal on overlay click
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });

    // ============ EXPORT / IMPORT ============
    function exportData() {
      const data = JSON.stringify(tasks, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const date = new Date().toISOString().split('T')[0];
      a.href = url;
      a.download = `suivi-taches-${date}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) {
            alert("Fichier invalide : le contenu doit être une liste d'actions.");
            return;
          }
          const count = imported.length;
          if (confirm(`Importer ${count} action${count > 1 ? 's' : ''} ?\n\nCela remplacera toutes vos données actuelles.`)) {
            tasks = imported;
            saveTasks();
            render();
          }
        } catch (err) {
          alert('Erreur de lecture du fichier. Vérifiez qu\'il s\'agit d\'un fichier JSON valide.');
        }
      };
      reader.readAsText(file);
      // Reset input pour pouvoir réimporter le même fichier
      event.target.value = '';
    }

    // ============ CLIPBOARD SYNC ============
    function showToast(message, duration = 2500) {
      const existing = document.querySelector('.footer-toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'footer-toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), duration);
    }

    async function copyData() {
      try {
        const data = JSON.stringify(tasks);
        await navigator.clipboard.writeText(data);
        showToast(`✓ ${tasks.length} action${tasks.length > 1 ? 's' : ''} copiée${tasks.length > 1 ? 's' : ''} dans le presse-papier`);
      } catch (err) {
        // Fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = JSON.stringify(tasks);
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast(`✓ ${tasks.length} action${tasks.length > 1 ? 's' : ''} copiée${tasks.length > 1 ? 's' : ''}`);
      }
    }

    async function pasteData() {
      try {
        const text = await navigator.clipboard.readText();
        const imported = JSON.parse(text);
        if (!Array.isArray(imported)) {
          alert('Le presse-papier ne contient pas de données valides.');
          return;
        }
        const count = imported.length;
        if (confirm(`Coller ${count} action${count > 1 ? 's' : ''} ?\n\nCela remplacera toutes vos données actuelles.`)) {
          tasks = imported;
          saveTasks();
          render();
          showToast(`✓ ${count} action${count > 1 ? 's' : ''} importée${count > 1 ? 's' : ''}`);
        }
      } catch (err) {
        alert('Impossible de lire le presse-papier.\n\nVérifiez que vous avez bien copié les données depuis l\'autre appareil et que le navigateur autorise l\'accès au presse-papier.');
      }
    }

    // ============ RECURRENCE CHOICE (Delete / Edit) ============
    function showRecurrenceChoice(title, description, onThisOne, onAll) {
      const overlay = document.createElement('div');
      overlay.className = 'rec-choice-overlay';
      overlay.innerHTML = `
        <div class="rec-choice-box">
          <h3>${title}</h3>
          <p>${description}</p>
          <div class="rec-choice-btns">
            <button class="rec-choice-btn" id="recChoiceThis">
              ${icons.circle}
              <div><strong>Cette occurrence uniquement</strong><span>Les autres occurrences ne sont pas affectées</span></div>
            </button>
            <button class="rec-choice-btn" id="recChoiceAll">
              ${icons.repeat}
              <div><strong>Toutes les occurrences</strong><span>L'action récurrente entière est concernée</span></div>
            </button>
            <button class="rec-choice-btn" style="justify-content:center;color:#94a3b8;" id="recChoiceCancel">
              Annuler
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      overlay.querySelector('#recChoiceThis').onclick = () => { overlay.remove(); onThisOne(); };
      overlay.querySelector('#recChoiceAll').onclick = () => { overlay.remove(); onAll(); };
      overlay.querySelector('#recChoiceCancel').onclick = () => { overlay.remove(); };
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

    function handleDelete(id, displayDeadline, isRecurring) {
      if (isRecurring) {
        showRecurrenceChoice(
          "Supprimer l'action",
          'Cette action est récurrente. Que souhaitez-vous supprimer ?',
          () => {
            // Delete only this occurrence — add to completedDates to skip it
            const task = tasks.find(t => t.id === id);
            if (task) {
              if (!task.completedDates) task.completedDates = [];
              if (!task.completedDates.includes(displayDeadline)) {
                task.completedDates.push(displayDeadline);
              }
              // Add to a "deletedDates" to differentiate from completed
              if (!task.deletedDates) task.deletedDates = [];
              if (!task.deletedDates.includes(displayDeadline)) {
                task.deletedDates.push(displayDeadline);
              }
              // Check if all gone
              const allOcc = getRecurrenceOccurrences(task);
              const remaining = allOcc.filter(d => !task.completedDates.includes(d));
              if (remaining.length === 0) {
                tasks = tasks.filter(t => t.id !== id);
              }
              saveTasks();
              render();
            }
          },
          () => {
            // Delete all — remove entire task
            const card = document.getElementById(`task-${id}`);
            if (card) card.classList.add('deleting');
            setTimeout(() => {
              tasks = tasks.filter(t => t.id !== id);
              saveTasks();
              render();
            }, 300);
          }
        );
      } else {
        deleteTask(id);
      }
    }

    function handleEdit(id, displayDeadline, isRecurring) {
      if (isRecurring) {
        showRecurrenceChoice(
          "Modifier l'action",
          'Cette action est récurrente. Que souhaitez-vous modifier ?',
          () => {
            // Edit only this occurrence: extract it as a standalone task
            const original = tasks.find(t => t.id === id);
            if (!original) return;
            
            // Mark this date as completed/removed from the recurring task
            if (!original.completedDates) original.completedDates = [];
            if (!original.completedDates.includes(displayDeadline)) {
              original.completedDates.push(displayDeadline);
            }
            if (!original.deletedDates) original.deletedDates = [];
            if (!original.deletedDates.includes(displayDeadline)) {
              original.deletedDates.push(displayDeadline);
            }
            
            // Create a new standalone task with this occurrence's date
            // Les commentaires propres à cette occurrence suivent l'action extraite ;
            // ils quittent l'action récurrente d'origine pour ne plus s'y afficher.
            const occurrenceComments = (original.comments || []).filter(c => c.occurrenceDate === displayDeadline);
            if (occurrenceComments.length) {
              original.comments = original.comments.filter(c => c.occurrenceDate !== displayDeadline);
            }
            const newTask = {
              id: generateId(),
              title: original.title,
              contact: original.contact,
              deadline: displayDeadline,
              type: original.type === 'rdv' ? 'rdv' : 'task',
              urgency: original.urgency,
              category: original.category || 'pro',
              status: 'todo',
              createdAt: new Date().toISOString(),
              comments: occurrenceComments.map(c => { const { occurrenceDate, ...rest } = c; return rest; }),
            };
            tasks.unshift(newTask);
            
            // Check if recurring has any remaining
            const allOcc = getRecurrenceOccurrences(original);
            const remaining = allOcc.filter(d => !original.completedDates.includes(d));
            if (remaining.length === 0) {
              tasks = tasks.filter(t => t.id !== id);
            }
            
            saveTasks();
            
            // Open edit modal on the new standalone task
            completingTask = newTask;
            modalMode = 'edit';
            renderModal();
            document.getElementById('modalOverlay').classList.remove('hidden');
          },
          () => {
            // Edit all — open the recurring task itself for editing
            openEditModal(id);
          }
        );
      } else {
        openEditModal(id);
      }
    }

    // ============ BILAN / RÉSUMÉ DES ACTIONS TERMINÉES ============
    // Récapitulatif des actions terminées sur une période choisie
    // (semaine précédente ou plage personnalisée), avec les commentaires
    // de clôture et les commentaires associés, regroupés par contact.
    let summaryFrom = '';
    let summaryTo = '';
    let summaryQuick = 'lastWeek';

    function toISODateLocal(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function openSummary() {
      setSummaryQuick('lastWeek');
      modalMode = 'summary';
      completingTask = null;
      viewingContact = null;
      renderModal();
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    function setSummaryQuick(mode) {
      summaryQuick = mode;
      const today = new Date();
      const dow = today.getDay(); // 0=Dim ... 6=Sam
      const daysSinceMon = dow === 0 ? 6 : dow - 1;
      const thisMon = new Date(today.getFullYear(), today.getMonth(), today.getDate() - daysSinceMon);
      let from, to;
      if (mode === 'lastWeek') {
        from = new Date(thisMon); from.setDate(thisMon.getDate() - 7);
        to = new Date(thisMon); to.setDate(thisMon.getDate() - 1);
      } else if (mode === 'thisWeek') {
        from = new Date(thisMon);
        to = new Date(today);
      } else if (mode === 'lastMonth') {
        from = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        to = new Date(today.getFullYear(), today.getMonth(), 0);
      } else if (mode === 'thisMonth') {
        from = new Date(today.getFullYear(), today.getMonth(), 1);
        to = new Date(today);
      } else {
        return;
      }
      summaryFrom = toISODateLocal(from);
      summaryTo = toISODateLocal(to);
      summaryExpandedEntries.clear();
      if (modalMode === 'summary') renderModal();
    }

    function setSummaryDate(which, value) {
      if (!value) return;
      if (which === 'from') summaryFrom = value; else summaryTo = value;
      summaryQuick = 'custom';
      summaryExpandedEntries.clear();
      renderModal();
    }

    // Renvoie les actions terminées dont la date d'achèvement (completedAt)
    // tombe dans la période [fromDate ; toDate] (inclus).
    // Pour les actions récurrentes, chaque occurrence terminée compte
    // comme une entrée distincte (via completionLog).
    // Actions créées dans la période (date de création comprise dans [from ; to])
    function getCreatedInPeriod(fromDate, toDate) {
      if (!fromDate || !toDate) return [];
      const fromMs = new Date(fromDate + 'T00:00:00').getTime();
      const toMs = new Date(toDate + 'T23:59:59').getTime();
      const results = [];
      tasks.forEach(t => {
        if (!t.createdAt) return;
        const ms = new Date(t.createdAt).getTime();
        if (ms < fromMs || ms > toMs) return;
        const comments = (t.comments || []).map(c => ({ text: c.text, date: c.date }));
        results.push({
          kind: 'created',
          id: t.id,
          type: t.type === 'rdv' ? 'rdv' : 'task',
          title: t.title,
          contact: t.contact || '',
          category: t.category || 'pro',
          createdAt: t.createdAt,
          at: t.createdAt,
          deadline: t.deadline || '',
          completionComment: '',
          comments,
        });
      });
      results.sort((a, b) => new Date(b.at) - new Date(a.at));
      return results;
    }

    // Entrées du Rapport : actions créées + actions terminées sur la période
    function getReportEntries(fromDate, toDate) {
      return getCreatedInPeriod(fromDate, toDate).concat(getCompletedInPeriod(fromDate, toDate));
    }

    function getCompletedInPeriod(fromDate, toDate) {
      if (!fromDate || !toDate) return [];
      const fromMs = new Date(fromDate + 'T00:00:00').getTime();
      const toMs = new Date(toDate + 'T23:59:59').getTime();
      const results = [];
      tasks.forEach(t => {
        if (t.recurrence) {
          const completedDates = getCompletedOccurrenceDates(t);
          const logByDate = {};
          (t.completionLog || []).forEach(e => { logByDate[e.date] = e; });
          completedDates.forEach(date => {
            const logEntry = logByDate[date];
            // completedAt réel si connu, sinon on se rabat sur la date d'occurrence
            const completedAt = (logEntry && logEntry.completedAt) ? logEntry.completedAt : (date + 'T12:00:00');
            const ms = new Date(completedAt).getTime();
            if (ms < fromMs || ms > toMs) return;
            const occComments = (t.comments || [])
              .filter(c => !c.occurrenceDate || c.occurrenceDate === date)
              .map(c => ({ text: c.text, date: c.date }));
            results.push({
              kind: 'done',
              id: t.id,
              type: t.type === 'rdv' ? 'rdv' : 'task',
              title: t.title,
              contact: t.contact || '',
              category: t.category || 'pro',
              completedAt,
              at: completedAt,
              deadline: date,
              completionComment: logEntry ? (logEntry.comment || '') : '',
              comments: occComments,
            });
          });
        } else if (t.status === 'done' && t.completedAt) {
          const ms = new Date(t.completedAt).getTime();
          if (ms < fromMs || ms > toMs) return;
          const comments = (t.comments || []).map(c => ({ text: c.text, date: c.date }));
          results.push({
            kind: 'done',
            id: t.id,
            type: t.type === 'rdv' ? 'rdv' : 'task',
            title: t.title,
            contact: t.contact || '',
            category: t.category || 'pro',
            completedAt: t.completedAt,
            at: t.completedAt,
            deadline: t.deadline || '',
            completionComment: t.completionComment || '',
            comments,
          });
        }
      });
      // Les plus récentes en premier
      results.sort((a, b) => new Date(b.at) - new Date(a.at));
      return results;
    }

    function buildSummaryGroups(results) {
      const NO_CONTACT_KEY = '__noc__';
      const groups = {};
      results.forEach(r => {
        const key = r.contact.trim() ? r.contact.trim() : NO_CONTACT_KEY;
        (groups[key] = groups[key] || []).push(r);
      });
      // Dans chaque groupe : l'événement le plus récent en haut
      Object.keys(groups).forEach(k => {
        groups[k].sort((a, b) => new Date(b.at || '') - new Date(a.at || ''));
      });
      const groupKeys = Object.keys(groups).sort((a, b) => {
        if (a === NO_CONTACT_KEY) return 1;
        if (b === NO_CONTACT_KEY) return -1;
        return a.localeCompare(b, 'fr');
      });
      return { groups, groupKeys, NO_CONTACT_KEY };
    }

    // Cartes du Rapport dépliées par l'utilisateur (index des entrées)
    let summaryExpandedEntries = new Set();

    function toggleSummaryEntry(idx, ev) {
      // Les clics sur la zone déjà déroulée ne replient pas la carte
      if (ev && ev.target && ev.target.closest('.summary-task-details, button, a')) return;
      const el = document.getElementById('sum-details-' + idx);
      const chev = document.getElementById('sum-chev-' + idx);
      if (summaryExpandedEntries.has(idx)) {
        summaryExpandedEntries.delete(idx);
        if (el) el.classList.add('hidden');
        if (chev) chev.innerHTML = icons.chevronDown;
      } else {
        summaryExpandedEntries.add(idx);
        if (el) el.classList.remove('hidden');
        if (chev) chev.innerHTML = icons.chevronUp;
      }
    }

    function renderSummaryModal() {
      const modal = document.getElementById('modal');
      if (!summaryFrom || !summaryTo) setSummaryQuick('lastWeek');
      const entries = getReportEntries(summaryFrom, summaryTo);
      const { groups, groupKeys, NO_CONTACT_KEY } = buildSummaryGroups(entries);
      const createdCount = entries.filter(r => r.kind === 'created').length;
      const doneCount = entries.filter(r => r.kind === 'done').length;
      // Nombre de rendez-vous distincts dans le rapport (en cours ou terminés)
      const rdvCount = new Set(entries.filter(r => r.type === 'rdv').map(r => r.id)).size;
      // Index stable de chaque entrée (pour l'état plié/déplié des cartes)
      entries.forEach((e, i) => { e._idx = i; });

      // Une entrée du rapport : « créée » (vert) ou « terminée » (gris),
      // avec pastille d'état à gauche pour une lecture rapide ; les
      // commentaires et commentaire de clôture se déroulent au clic sur la carte
      const renderTask = (r) => {
        const isCreated = r.kind === 'created';
        const isRdv = r.type === 'rdv';
        // Un rendez-vous terminé est « tenu » à sa date d'échéance initiale
        // (et non à sa date de clôture) ; l'échéance n'est alors pas répétée
        const isDoneRdv = !isCreated && isRdv && !!r.deadline;
        const idx = r._idx;
        const expanded = summaryExpandedEntries.has(idx);
        const hasDetails = (!isCreated && r.completionComment) || r.comments.length > 0;
        const whenLabel = isCreated
          ? 'Créée le ' + formatDate(r.at, true)
          : (isDoneRdv ? 'Tenu le ' + formatDate(r.deadline) : 'Terminée le ' + formatDate(r.at, true));
        return `
        <div class="summary-task ${isCreated ? 'created' : 'done'}" onclick="toggleSummaryEntry(${idx}, event)" title="${hasDetails ? (expanded ? 'Replier les commentaires' : 'Dérouler les commentaires') : ''}">

            </div>
            <div class="summary-task-meta">
              ${isRdv ? `<span class="rdv-badge">${icons.calendarCheck} Rendez-vous</span>` : ''}
              <span class="category-badge ${r.category}">${r.category === 'pro' ? icons.briefcase + ' Pro' : icons.home + ' Perso'}</span>
              ${r.deadline && !isDoneRdv ? `<span class="task-meta-item">${icons.calendar} Échéance ${formatDate(r.deadline)}</span>` : ''}
            </div>
            ${hasDetails ? `
            <div class="summary-task-details ${expanded ? '' : 'hidden'}" id="sum-details-${idx}">
              ${!isCreated && r.completionComment ? `
                <div class="summary-comment completion">

                  <div style="min-width:0;">

              ${r.comments.length ? `

                  ${r.comments.map(c => `

      // Compteurs par type sous le nom du contact
      const renderGroupCounts = (list) => {
        const c = list.filter(r => r.kind === 'created').length;
        const d = list.filter(r => r.kind === 'done').length;
        return `

          <div class="summary-stats">

          </div>
        </div>
      `;
    }

    function copySummary() {
      const entries = getReportEntries(summaryFrom, summaryTo);
      const { groups, groupKeys, NO_CONTACT_KEY } = buildSummaryGroups(entries);
      const createdCount = entries.filter(e => e.kind === 'created').length;
      const doneCount = entries.filter(e => e.kind === 'done').length;
      const lines = [];
      lines.push(`Rapport — du ${formatDate(summaryFrom + 'T00:00:00')} au ${formatDate(summaryTo + 'T00:00:00')}`);
      lines.push(`${createdCount} action${createdCount > 1 ? 's' : ''} créée${createdCount > 1 ? 's' : ''}, ${doneCount} terminée${doneCount > 1 ? 's' : ''}`);
      groupKeys.forEach(key => {
        lines.push('');
        lines.push(key === NO_CONTACT_KEY ? 'Sans contact' : key);
        groups[key].forEach(r => {
          const doneRdv = r.kind !== 'created' && r.type === 'rdv' && r.deadline;
          const verb = r.kind === 'created' ? 'créée le' : (doneRdv ? 'tenu le' : 'terminée le');
          const when = r.kind === 'created' ? formatDate(r.at, true) : (doneRdv ? formatDate(r.deadline) : formatDate(r.at, true));
          const rdvPrefix = r.type === 'rdv' ? 'RDV — ' : '';
          lines.push(`• ${rdvPrefix}${r.title} (${verb} ${when})`);
          if (r.kind === 'done' && r.completionComment) lines.push(`   → ${r.completionComment}`);
          r.comments.forEach(c => lines.push(`   · ${c.text}`));
        });
      });
      const text = lines.join('\n');
      const ok = () => showToast('✓ Rapport copié dans le presse-papier');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok).catch(() => fallbackCopyText(text));
      } else {
        fallbackCopyText(text);
      }
    }

    function fallbackCopyText(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast('✓ Rapport copié'); }
      catch (e) { showToast('⚠ Copie impossible'); }
      document.body.removeChild(ta);
    }

// Colonne A = JSON complet de l'action (source de vérité), colonnes B à H
// = informations lisibles (titre, contact, échéance, statut...).
// Lève définitivement la limite des 50 000 caractères d'une cellule.
var TASK_HEADERS = ['JSON (ne pas modifier)', 'Titre', 'Compte', 'Échéance', 'Statut', 'Urgence', 'Catégorie', 'Terminée le'];

function writeTasks(tasks) {
  var sheet = getSheet();
  var values = [TASK_HEADERS];
  for (var i = 0; i < tasks.length; i++) {
    var t = tasks[i];
    values.push([
      JSON.stringify(t),
      t && t.title ? t.title : '',
      t && t.contact ? t.contact : '',
      t && t.deadline ? t.deadline : '',
      t && t.status === 'done' ? 'Terminée' : 'À faire',
      t && t.urgency ? t.urgency : '',
      t && t.category ? t.category : '',
      t && t.completedAt ? fmtDateTime(t.completedAt) : ''
    ]);
  }
  sheet.clearContents();
  sheet.getRange(1, 1, values.length, TASK_HEADERS.length).setValues(values);
  sheet.getRange(1, 1, 1, TASK_HEADERS.length).setFontWeight('bold');
  sheet.setFrozenRows(1);
}

// Lecture : une ligne par action. L'ancien format (tout le tableau dans la
// cellule A1) reste accepté pour la migration automatique : dès le premier
// enregistrement, les données sont réécrites au nouveau format.
function readTasks() {
  try {
    var sheet = getSheet();
    var lastRow = sheet.getLastRow();
    if (lastRow < 1) return [];
    var firstCell = sheet.getRange(1, 1).getValue();
    // Ancien format : la cellule A1 contient le tableau complet
    if (typeof firstCell === 'string' && firstCell.charAt(0) === '[') {
      var old = JSON.parse(firstCell);
      return Array.isArray(old) ? old : [];
    }
    if (lastRow < 2) return [];
    var col = sheet.getRange(2, 1, lastRow - 1, 1).getValues();
    var tasks = [];
    for (var i = 0; i < col.length; i++) {
      var raw = col[i][0];
      if (!raw) continue;
      try {
        var t = JSON.parse(raw);
        if (t && t.id) tasks.push(t);
      } catch (e) {
        // ligne illisible : ignorée
      }
    }
    return tasks;
  } catch (e) {
    return [];
  }
}

function doGet(e) {
  if (!checkPassword(e)) return jsonOut({ error: 'Mot de passe incorrect' });
  var p = (e && e.parameter) || {};
  if (p.action === 'emailconfig') {
    // Enregistrement (+ test) via GET — paramètre « set » = JSON de la config.
    // Ce canal est le plus fiable depuis un navigateur.
    if (p.set) {
      try {
        return jsonOut(handleEmailConfigSet(p));
      } catch (err) {
        return jsonOut({ ok: false, error: 'Erreur inattendue : ' + errMsg(err) });
      }
    }
    try {
      return jsonOut({ ok: true, version: 8, config: loadEmailConfig() });
    } catch (err) {
      return jsonOut({ ok: false, error: 'Lecture impossible : ' + errMsg(err) });
    }
  }
  return ContentService.createTextOutput(JSON.stringify({ tasks: readTasks(), contacts: readContacts(), accounts: readAccounts() }))
    .setMimeType(ContentService.MimeType.JSON);
}

// Enregistre la config, met à jour le déclencheur, envoie un test si demandé.
// Chaque étape est protégée : aucune erreur ne fait planter le script
// (une page d erreur HTML serait bloquée par le navigateur et semblerait
// être un problème réseau).
function handleEmailConfigSet(p) {
  var result = { ok: true, version: 8, sent: false };
  var config = null;
  try {
    config = JSON.parse(p.set);
  } catch (err) {
    return { ok: false, error: 'Configuration invalide : ' + errMsg(err) };
  }
  try {
    saveEmailConfig(config);
  } catch (err) {
    return { ok: false, error: 'Enregistrement impossible : ' + errMsg(err) };
  }
  try {
    installEmailTrigger(config);
  } catch (err) {
    result.triggerError = errMsg(err);
  }
  if (p.test === '1') {
    try {
      result.sent = sendRecapEmail(config, true);
    } catch (err) {
      result.error = errMsg(err);
    }
  }
  return result;
}

function doPost(e) {
  if (!checkPassword(e)) return jsonOut({ error: 'Mot de passe incorrect' });
  var body = null;
  try { body = JSON.parse(e.postData.contents); } catch (err) { body = null; }
  // Un tableau = synchronisation des actions (une ligne par action) — ancien format
  if (Array.isArray(body)) {
    writeTasks(body);
    return jsonOut({ success: true });
  }
  // Objet { tasks, contacts, accounts } = actions + contacts + infos de comptes
  if (body && Array.isArray(body.tasks)) {
    writeTasks(body.tasks);
    if (Array.isArray(body.contacts)) writeContacts(body.contacts);
    if (body.accounts && typeof body.accounts === 'object') writeAccounts(body.accounts);
    return jsonOut({ success: true });
  }
  // Configuration du récap e-mail via POST (compatibilité) :
  // la même logique protégée que le canal GET
  if (body && body.action === 'emailconfig') {
    try {
      return jsonOut(handleEmailConfigSet({
        set: JSON.stringify(body.config || {}),
        test: body.test ? '1' : '0'
      }));
    } catch (err) {
      return jsonOut({ ok: false, error: 'Erreur inattendue : ' + errMsg(err) });
    }
  }
  return jsonOut({ error: 'Action inconnue' });
}

var MOIS_FR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
var JOURS_FR = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];

}

// Crée / met à jour le déclencheur horaire selon la configuration.
// Appelé à chaque enregistrement depuis l'application.
function installEmailTrigger(config) {
  var i;
  var triggers = ScriptApp.getProjectTriggers();
  for (i = 0; i < triggers.length; i++) {
    if (triggers[i].getHandlerFunction() === 'emailRecapTrigger') {
      ScriptApp.deleteTrigger(triggers[i]);
    }
  }
  if (!config || !config.enabled || !config.email) return;
  var builder = ScriptApp.newTrigger('emailRecapTrigger').timeBased();
  if (config.frequency === 'daily') {
    builder.everyDays(1).atHour(config.hour || 8);
  } else {
    var days = [ScriptApp.WeekDay.MONDAY, ScriptApp.WeekDay.TUESDAY,
      ScriptApp.WeekDay.WEDNESDAY, ScriptApp.WeekDay.THURSDAY,
      ScriptApp.WeekDay.FRIDAY, ScriptApp.WeekDay.SATURDAY,
      ScriptApp.WeekDay.SUNDAY];
    var idx = (config.day || 1) - 1;
    if (idx < 0 || idx > 6) idx = 0;
    builder.onWeekDay(days[idx]).atHour(config.hour || 8);
  }
  builder.create();
}

// ---------- utilitaires dates ----------
function todayStr() {
  return Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd');
}

function plusDaysStr(n) {
  var d = new Date();
  d.setDate(d.getDate() + n);
  return Utilities.formatDate(d, Session.getScriptTimeZone(), 'yyyy-MM-dd');
}

function fmtDate(dateStr) {
  if (!dateStr || dateStr.length < 10) return '';
  var p = dateStr.split('-');
  var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  return JOURS_FR[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS_FR[d.getMonth()];
}

function fmtDateTime(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  var hh = ('0' + d.getHours()).slice(-2);
  var mm = ('0' + d.getMinutes()).slice(-2);
  return d.getDate() + ' ' + MOIS_FR[d.getMonth()] + ' à ' + hh + ':' + mm;
}

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ---------- préparation des actions ----------
// Déplie les actions récurrentes : 1 entrée « à faire » pour la prochaine
// occurrence restante + 1 entrée « terminée » par occurrence complétée
function expandForEmail(tasks) {
  var out = [], i, j;
  for (i = 0; i < tasks.length; i++) {
    var t = tasks[i];
    if (t.recurrence && t.recurrence.startDate && t.recurrence.endDate) {
      var occ = occurrenceDates(t.recurrence);
      var deleted = t.deletedDates || [];
      var completed = t.completedDates || [];
      var excluded = completed.concat(deleted);
      var remaining = [];
      for (j = 0; j < occ.length; j++) {
        if (excluded.indexOf(occ[j]) === -1) remaining.push(occ[j]);
      }
      for (j = 0; j < completed.length; j++) {
        if (deleted.indexOf(completed[j]) !== -1) continue;
        var log = findLogEntry(t.completionLog || [], completed[j]);
        out.push({
          title: t.title, contact: t.contact, urgency: t.urgency,
          category: t.category, deadline: completed[j], status: 'done',
          completedAt: log && log.completedAt ? log.completedAt : completed[j] + 'T12:00:00',
          completionComment: log ? (log.comment || '') : ''
        });
      }
      if (remaining.length > 0) {
        var today = todayStr();
        var upcoming = [], overdue = [];
        for (j = 0; j < remaining.length; j++) {
          if (remaining[j] >= today) upcoming.push(remaining[j]);
          else overdue.push(remaining[j]);
        }
        var next = upcoming.length > 0 ? upcoming[0] : overdue[overdue.length - 1];
        out.push({
          title: t.title, contact: t.contact, urgency: t.urgency,
          category: t.category, deadline: next, status: 'todo'
        });
      }
    } else {
      out.push(t);
    }
  }
  return out;
}

function occurrenceDates(r) {
  var out = [];
  var cur = new Date(r.startDate + 'T00:00:00');
  var end = new Date(r.endDate + 'T00:00:00');
  var days = r.days || [];
  while (cur <= end) {
    var dow = cur.getDay();
    dow = dow === 0 ? 6 : dow - 1; // 0 = lundi ... 6 = dimanche
    if (days.indexOf(dow) !== -1) {
      out.push(Utilities.formatDate(cur, Session.getScriptTimeZone(), 'yyyy-MM-dd'));
    }
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}

function findLogEntry(log, date) {
  for (var i = 0; i < log.length; i++) {
    if (log[i].date === date) return log[i];
  }
  return null;
}

function countIf(arr, fn) {
  var n = 0;
  for (var i = 0; i < arr.length; i++) {
    if (fn(arr[i])) n++;
  }
  return n;
}

// Sélectionne les actions selon le contenu choisi et la période « terminées »
function buildRecapData(config) {
  var today = todayStr();
  var in7 = plusDaysStr(7);
  var all = expandForEmail(readTasks());
  var todo = [], done = [], i;
  for (i = 0; i < all.length; i++) {
    var t = all[i];
    if (t.status === 'done') { done.push(t); continue; }
    var isLate = t.deadline && t.deadline < today;
    var isUrgent = t.urgency === 'urgent';
    if (config.content === 'attention') {
      if (!isLate && !isUrgent) continue;
    } else if (config.content === 'today') {
      if (!t.deadline || t.deadline !== today) continue;
    } else if (config.content === 'week') {
      if (!t.deadline || t.deadline > in7) continue;
    }
    todo.push(t);
  }
  todo.sort(function (a, b) {
    var da = a.deadline || '9999-12-31';
    var db = b.deadline || '9999-12-31';
    return da < db ? -1 : (da > db ? 1 : 0);
  });
  var doneFiltered = [];
  if (config.includeDone) {
    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - (config.frequency === 'daily' ? 1 : 7));
    for (i = 0; i < done.length; i++) {
      var ca = done[i].completedAt ? new Date(done[i].completedAt) : null;
      if (ca && !isNaN(ca.getTime()) && ca >= cutoff) doneFiltered.push(done[i]);
    }
    doneFiltered.sort(function (a, b) {
      return new Date(b.completedAt).getTime() - new Date(a.completedAt).getTime();
    });
  }
  return {
    today: today,
    todo: todo,
    done: doneFiltered,
    lateCount: countIf(todo, function (t) { return t.deadline && t.deadline < today; }),
    urgentCount: countIf(todo, function (t) { return t.urgency === 'urgent'; })
  };
}

function badgeHtml(kind, label) {
  var bg = kind === 'urgent' ? '#fef3c7' : '#fee2e2';
  var fg = kind === 'urgent' ? '#b45309' : '#dc2626';
  return '<span style="display:inline-block;background:' + bg + ';color:' + fg +
    ';border-radius:4px;padding:1px 6px;font-size:10px;font-weight:bold;vertical-align:middle;">' + label + '</span>';
}

function taskHtml(t, today, withContact) {
  var html = '<div style="padding:8px 12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:6px;font-size:13px;line-height:1.5;">';
  html += '<b>' + esc(t.title) + '</b> ';
  if (t.urgency === 'urgent') html += badgeHtml('urgent', '⚡ URGENT');
  if (t.deadline && t.deadline < today) html += ' ' + badgeHtml('late', '⏰ RETARD');
  html += '<br><span style="color:#64748b;">';
  if (withContact && t.contact) html += esc(t.contact) + ' — ';
  html += 'échéance ' + esc(fmtDate(t.deadline)) + '</span></div>';
  return html;
}

function groupByContact(items) {
  var groups = {}, keys = [], i;
  for (i = 0; i < items.length; i++) {
    var k = (items[i].contact || '').trim() || 'Sans contact';
    if (!groups[k]) { groups[k] = []; keys.push(k); }
    groups[k].push(items[i]);
  }
  keys.sort(function (a, b) { return a < b ? -1 : (a > b ? 1 : 0); });
  return { groups: groups, keys: keys };
}

function buildRecapText(data, isTest) {

  lines.push('Récap de vos actions' + (isTest ? ' — TEST' : ''));
  lines.push(data.todo.length + ' à faire' +
    (data.lateCount ? ', ' + data.lateCount + ' en retard' : '') +
    (data.urgentCount ? ', ' + data.urgentCount + ' urgentes' : ''));
  lines.push('');
  var i;
  for (i = 0; i < data.todo.length; i++) {
    var t = data.todo[i];
    var line = '- ' + t.title;
    if (t.contact) line += ' (' + t.contact + ')';
    if (t.deadline) line += ' — échéance ' + t.deadline;
    if (t.urgency === 'urgent') line += ' [URGENT]';
    if (t.deadline && t.deadline < data.today) line += ' [RETARD]';
    lines.push(line);
  }
  if (data.done.length > 0) {
    lines.push('');
    lines.push('Terminées récemment :');
    for (i = 0; i < data.done.length; i++) {
      var l = '- ' + data.done[i].title;
      if (data.done[i].completionComment) l += ' : ' + data.done[i].completionComment;
      lines.push(l);
    }
  }
  if (data.todo.length === 0 && data.done.length === 0) {
    lines.push('Rien à signaler : aucune action en attente.');
  }
  return lines.join(NL);
}

      };

    async function syncToCloud() {
      if (!cloudUrl) return;
      syncStatus = 'syncing';
      updateSyncIndicator();
      try {
        const url = cloudUrl + (cloudUrl.includes('?') ? '&' : '?') + 'pwd=' + encodeURIComponent(cloudPassword);
        await fetch(url, {
          method: 'POST',
          body: JSON.stringify({ tasks: tasks, contacts: contactList, accounts: accountInfo }),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },

        });

    function openCloudSetup() {

    // ============ FUSION LOCAL / CLOUD (première configuration) ============
    // À la première connexion au cloud, on ne veut ni effacer les données
    // locales ni ignorer celles déjà présentes dans le cloud : on fusionne les
    // deux jeux d'actions (union par identifiant) afin de tout conserver.
    // En cas de conflit (même action des deux côtés), la version locale est
    // conservée pour les champs simples ; une action terminée d'un côté reste
    // terminée ; les commentaires, occurrences et journal de récurrence sont
    // réunis sans doublon.
    function mergeTasks(localArr, cloudArr) {
      const map = new Map();
      const upsert = (t) => {
        if (!t || !t.id) return;
        const cur = map.get(t.id);
        if (!cur) { map.set(t.id, JSON.parse(JSON.stringify(t))); return; }
        map.set(t.id, mergeTwoTasks(cur, t));
      };
      (localArr || []).forEach(upsert);
      (cloudArr || []).forEach(upsert);
      return Array.from(map.values());
    }

    function mergeTwoTasks(a, b) {
      const pick = (x, y) => ((x === undefined || x === null || x === '') ? y : x);
      const result = { ...a };
      result.title = pick(a.title, b.title);
      result.contact = pick(a.contact, b.contact);
      result.deadline = pick(a.deadline, b.deadline);
      result.description = pick(a.description, b.description) || undefined;
      result.category = pick(a.category, b.category) || 'pro';
      result.urgency = pick(a.urgency, b.urgency) || 'normal';
      // Une action terminée d'un côté reste terminée (la clôture est « collante »)
      if (a.status === 'done' || b.status === 'done') {
        result.status = 'done';
        result.completedAt = pick(a.completedAt, b.completedAt);
        result.completionComment = pick(a.completionComment, b.completionComment) || undefined;
      } else {
        result.status = 'todo';
      }
      result.comments = mergeComments(a.comments, b.comments);
      if (a.recurrence || b.recurrence) {
        result.recurrence = a.recurrence || b.recurrence;
        result.completedDates = Array.from(new Set([...(a.completedDates||[]), ...(b.completedDates||[])]));
        result.deletedDates = Array.from(new Set([...(a.deletedDates||[]), ...(b.deletedDates||[])]));
        result.completionLog = mergeCompletionLog(a.completionLog, b.completionLog);
      }
      return result;
    }

    function mergeComments(a, b) {
      const seen = new Set();
      const out = [];
      [...(a || []), ...(b || [])].forEach(c => {
        if (!c || c.text === undefined) return;
        const key = (c.text || '') + '|' + (c.date || '') + '|' + (c.occurrenceDate || '');
        if (seen.has(key)) return;
        seen.add(key);
        out.push({ ...c });
      });
      return out;
    }

    function mergeCompletionLog(a, b) {
      const byDate = {};
      const consider = (e) => {
        if (!e || !e.date) return;
        const cur = byDate[e.date];
        if (!cur) { byDate[e.date] = { ...e }; return; }
        const merged = { ...cur };
        if (!cur.completedAt && e.completedAt) merged.completedAt = e.completedAt;
        if (!cur.comment && e.comment) merged.comment = e.comment;
        byDate[e.date] = merged;
      };
      (a || []).forEach(consider);
      (b || []).forEach(consider);
      return Object.values(byDate);
    }

    // Première configuration du cloud : on récupère le contenu distant puis on
    // le FUSIONNE avec les données locales (rien n'est effacé), avant de
    // renvoyer l'ensemble fusionné vers le cloud pour que les deux restent
    // identiques et complets.
    async function firstSyncMerge() {
      syncStatus = 'syncing';
      updateSyncIndicator();
      try {
        const url = cloudUrl + (cloudUrl.includes('?') ? '&' : '?') + 'pwd=' + encodeURIComponent(cloudPassword);
        const response = await fetch(url, { redirect: 'follow' });
        const data = await response.json();
        if (data && data.error) {
          syncStatus = 'error';
          updateSyncIndicator();
          showToast('⚠ ' + data.error);
          return;
        }
        const cloudTasks = Array.isArray(data) ? data : (data && Array.isArray(data.tasks) ? data.tasks : []);
        const cloudContacts = (data && !Array.isArray(data) && Array.isArray(data.contacts)) ? data.contacts : [];
        const cloudAccounts = (data && !Array.isArray(data) && data.accounts && typeof data.accounts === 'object') ? data.accounts : {};
        const before = tasks.length;
        tasks = mergeTasks(tasks, cloudTasks);
        // Fusion des contacts : union par identifiant, la version locale gagne
        const contactMap = new Map();
        contactList.forEach(c => { if (c && c.id) contactMap.set(c.id, c); });
        cloudContacts.forEach(c => { if (c && c.id && !contactMap.has(c.id)) contactMap.set(c.id, c); });
        contactList = Array.from(contactMap.values());
        saveContacts();
        // Fusion des infos de comptes : les comptes absents en local sont récupérés
        Object.keys(cloudAccounts).forEach(k => { if (!(k in accountInfo)) accountInfo[k] = cloudAccounts[k]; });
        saveAccountInfo();
        localStorage.setItem('taskflow-tasks', JSON.stringify(tasks));
        render();
        // Renvoie le résultat fusionné pour que le cloud soit à jour lui aussi
        await syncToCloud();
        const gained = tasks.length - before;
        showToast(gained > 0
          ? `✓ Cloud configuré · ${gained} action${gained>1?'s':''} récupérée${gained>1?'s':''} du cloud`
          : '✓ Cloud configuré et synchronisé');
      } catch (err) {
        console.error('First sync error:', err);
        syncStatus = 'error';
        updateSyncIndicator();
        showToast('⚠ Cloud configuré, mais lecture du cloud impossible — réessayez « Récupérer du cloud »');
      }
    }

    function saveCloudUrl() {
      const urlInput = document.getElementById('cloudUrlInput');
      const pwdInput = document.getElementById('cloudPwdInput');
      const url = urlInput.value.trim();
      const pwd = pwdInput.value.trim();
      if (!url) { urlInput.focus(); return; }
      if (!pwd) { pwdInput.focus(); return; }
      const wasConnected = !!cloudUrl;
      cloudUrl = url;
      cloudPassword = pwd;
      localStorage.setItem('taskflow-cloud-url', url);
      localStorage.setItem('taskflow-cloud-pwd', pwd);
      syncStatus = 'syncing';
      updateSyncIndicator();
      closeModal();
      if (!wasConnected) {
        // Première connexion : fusion des données locales et cloud (rien n'est effacé)
        firstSyncMerge();
      } else {
        // Mise à jour de la connexion (URL/mot de passe) : simple envoi des données
        syncToCloud().then(() => showToast('✓ Connexion mise à jour'));
      }
    }

    async function pushEmailRecapConfig(config, test) {
      try {
        // Enregistrement via GET (canal le plus fiable depuis un navigateur ;
        // la vérification et la lecture utilisent déjà GET avec succès)
        const base = cloudUrl + (cloudUrl.includes('?') ? '&' : '?') + 'pwd=' + encodeURIComponent(cloudPassword);
        const url = base + '&action=emailconfig&set=' + encodeURIComponent(JSON.stringify(config)) + (test ? '&test=1' : '');
        const response = await fetch(url, { redirect: 'follow' });
        const text = await response.text();
        let data = null;
        try { data = JSON.parse(text); } catch (e) { data = null; }
        if (!data) {
          // Réponse non JSON (page d'erreur Google) : le script a probablement
          // planté — déploiement non mis à jour ou autorisation manquante
          console.error('Réponse inattendue du script cloud :', text.substring(0, 400));
          showToast('⚠ Le script cloud a renvoyé une erreur — vérifiez que la dernière version du code est bien déployée (nouvelle version) et autorisée');
          return;
        }
        // Un script version < 3 répond « ok » mais IGNORE la commande
        // d'enregistrement : il faut recopier le dernier code et redéployer
        if (data.ok && !(data.version >= 8)) {
          showToast('⚠ Le script déployé est trop ancien (version ' + (data.version || '?') + ') — recopiez le DERNIER code et redéployez en choisissant « Version : Nouvelle »', 6000);
          const diag = document.getElementById('emailDiagResult');
          if (diag) {
            diag.classList.remove('hidden');
            diag.textContent = 'Résultat de la dernière action :\nScript cloud : version ' + (data.version || '?') + ' — TROP ANCIENNE\n→ Recopiez le dernier code Apps Script (Configuration cloud → « Activer le récap e-mail » → Copier) puis :\n→ Déployer → Gérer les déploiements → ✏️ → Version : « Nouvelle » → Déployer';
          }
          return;
        }
        if (data && data.ok) {
          emailRecap = { ...config };
          saveEmailRecapLocal();
          let msg;
          if (data.triggerError) {
            msg = '⚠ Récap enregistré mais déclencheur NON créé — dans l\'éditeur Apps Script, exécutez la fonction activerRecap (bouton Exécuter) et autorisez';
          } else if (test) {
            msg = data.sent ? '✓ E-mail de test envoyé à ' + config.email : '⚠ E-mail non envoyé' + (data.error ? ' : ' + data.error : '');
          } else if (config.enabled) {
            msg = '✓ Récap enregistré — envoi ' + (config.frequency === 'daily' ? 'chaque jour' : 'chaque semaine') + ' vers ' + config.hour + ' h';
          } else {
            msg = '✓ Récap e-mail désactivé';
          }
          showToast(msg, 6000);
          // Résultat complet et durable dans la zone de diagnostic
          const diag = document.getElementById('emailDiagResult');
          if (diag) {
            diag.classList.remove('hidden');
            const lines = ['Résultat de la dernière action :'];
            lines.push('Enregistré : oui');
            lines.push(data.triggerError ? 'Déclencheur : ERREUR — ' + data.triggerError : 'Déclencheur : créé/mis à jour ✓');
            if (test) {
              lines.push(data.sent
                ? 'E-mail de test : envoyé ✓ (vérifiez la boîte de ' + config.email + ', y compris les spams)'
                : 'E-mail de test : NON envoyé' + (data.error ? ' — ' + data.error : ' (raison inconnue)'));
            }
            diag.textContent = lines.join('\n');
          }
        } else {
          showToast('⚠ ' + ((data && data.error) || 'Réponse inattendue du script'), 6000);
        }
      } catch (err) {
        console.error('Email config error:', err);
        showToast('⚠ Impossible de joindre le script cloud (' + ((err && err.message) || 'erreur réseau') + ') — vérifiez l\'URL de déploiement');
      }
    }

    // Au démarrage : récupère la configuration du récap depuis le script
    // (le cloud reste la référence, comme pour les actions)
    async function fetchEmailRecapConfig() {
      if (!cloudUrl) return;
      try {
        const url = cloudUrl + (cloudUrl.includes('?') ? '&' : '?') + 'pwd=' + encodeURIComponent(cloudPassword) + '&action=emailconfig';
        const response = await fetch(url, { redirect: 'follow' });
        const data = await response.json();
        if (data && data.ok && data.version >= 2 && data.config) {
          emailRecap = { ...defaultEmailRecap, ...data.config };
          saveEmailRecapLocal();
        }
      } catch (err) {
        // silencieux : l'application garde sa copie locale
      }
    }

    // Diagnostic de connexion au script cloud : affiche l'URL utilisée,
    // le statut HTTP et un extrait de la réponse (ou l'erreur réseau exacte)
    async function runEmailDiagnostic() {
      const out = document.getElementById('emailDiagResult');
      if (out) {
        out.classList.remove('hidden');
        out.textContent = '⏳ Test en cours…';
      }
      const lines = [];
      lines.push('URL : ' + cloudUrl);
      const base = cloudUrl + (cloudUrl.includes('?') ? '&' : '?') + 'pwd=' + encodeURIComponent(cloudPassword);
      try {
        const response = await fetch(base + '&action=emailconfig', { redirect: 'follow' });
        const text = await response.text();
        lines.push('Statut HTTP : ' + response.status);
        let parsed = null;
        try { parsed = JSON.parse(text); } catch (e) { parsed = null; }
        if (parsed && parsed.ok && parsed.version >= 8) {
          lines.push('Script : version ' + parsed.version + ' ✓ (à jour, récap e-mail pris en charge)');
          lines.push('Récap configuré : ' + (parsed.config && parsed.config.enabled ? 'activé — ' + (parsed.config.email || '(sans adresse)') : 'désactivé'));
        } else if (parsed && parsed.ok) {
          lines.push('Script : version ' + (parsed.version || '?') + ' — TROP ANCIENNE. Recopiez le dernier code et redéployez en choisissant « Version : Nouvelle ».');
        } else if (parsed) {
          lines.push('Réponse JSON inattendue → ancien script déployé, il faut redéployer une nouvelle version.');
        } else {
          lines.push('Réponse non JSON (page Google) → probablement une erreur du script ou une page de connexion (accès pas réglé sur « Tout le monde »).');
        }
        lines.push('Corps : ' + (text.length > 160 ? text.substring(0, 160) + '…' : text));
      } catch (err) {
        lines.push('Échec de la requête : ' + ((err && err.message) || err));
        lines.push('→ Le script est injoignable depuis ce navigateur : vérifiez la connexion, l\'URL, ou que le script ne plante pas (page d\'erreur bloquée par le navigateur).');
      }
      if (out) out.textContent = lines.join('\n');
    }

    // ============ SCROLL TO TOP ============
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    window.addEventListener('scroll', () => {
      const btn = document.getElementById('scrollTopBtn');
      if (btn) btn.classList.toggle('visible', window.scrollY > 300);
    }, { passive: true });

    // ============ INIT ============
    updateSyncIndicator();
    render();
    if (cloudUrl) {
      // Auto-load from cloud on startup
      loadFromCloud();
      fetchEmailRecapConfig();
    }
    checkAndNotify();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') checkAndNotify();
    });

    // ============ PWA: Service Worker ============
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {
          // Échec silencieux (ex: ouverture en local file:// sans serveur)
        });
      });
    }
  </script>
</body>
