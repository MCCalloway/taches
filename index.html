    function renderFilters() {
      const container = document.getElementById('filtersContainer');
      if (tasks.length === 0) {
        container.classList.add('hidden');
        return;
      }
      container.classList.remove('hidden');
      
      // Base set for dynamic counts : on se base sur les tâches "dépliées" par occurrence
      // (comme dans renderTaskList) pour que les compteurs correspondent exactement à ce
      // qui est affiché : une occurrence de récurrence déjà terminée compte dans
      // "Terminées", jamais dans "À faire".
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      let base = filterTasksByPeriod(expandRecurringTasks([...tasks], filterDate || null));
      
      const counts = {
        all: base.length,
        todo: base.filter(t => t.status === 'todo').length,
        done: base.filter(t => t.status === 'done').length,
        late: base.filter(t => t.status === 'todo' && t.deadline && t.deadline < todayStr).length
      };
      
      document.getElementById('statusFilters').innerHTML = `
        <button class="filter-btn ${filterStatus === 'all' && !filterLate ? 'active' : ''}" onclick="filterLate=false;setFilterStatus('all')">
          ${icons.layoutList} <span>Toutes</span> <span class="count">${counts.all}</span>
        </button>
        <button class="filter-btn ${filterStatus === 'todo' && !filterLate ? 'active' : ''}" onclick="filterLate=false;setFilterStatus('todo')">
          ${icons.circle} <span>À faire</span> <span class="count">${counts.todo}</span>
        </button>
        <button class="filter-btn ${filterStatus === 'done' && !filterLate ? 'active' : ''}" onclick="filterLate=false;setFilterStatus('done')">
          ${icons.checkCircle} <span>Terminées</span> <span class="count">${counts.done}</span>
        </button>
        <button class="filter-btn ${filterLate ? 'active' : ''}" onclick="toggleFilterLate()" style="${filterLate ? 'color:#dc2626;' : ''}">
          ${icons.alertCircle} <span>En retard</span> <span class="count" style="${filterLate ? 'background:#fee2e2;color:#dc2626;' : ''}">${counts.late}</span>
        </button>
      `;

      // Sub-base: apply status/late filter for dynamic counts on category & urgency
      let subBase = [...base];
      if (filterLate) {
        subBase = subBase.filter(t => t.status === 'todo' && t.deadline && t.deadline < todayStr);
      } else if (filterStatus !== 'all') {
        subBase = subBase.filter(t => t.status === filterStatus);
      }

      const catCounts = {
        all: subBase.length,
        pro: subBase.filter(t => (t.category || 'pro') === 'pro').length,
        perso: subBase.filter(t => (t.category || 'pro') === 'perso').length
      };

      // Sub-sub-base: apply category filter for dynamic urgency counts
      let urgBase = [...subBase];
      if (filterCategory !== 'all') {
        urgBase = urgBase.filter(t => (t.category || 'pro') === filterCategory);
      }
      const urgCounts = {
        all: urgBase.length,
        normal: urgBase.filter(t => t.urgency === 'normal').length,
        urgent: urgBase.filter(t => t.urgency === 'urgent').length
      };

      document.getElementById('categoryFilters').innerHTML = `
        <button class="filter-btn ${filterCategory === 'all' ? 'active' : ''}" onclick="setFilterCategory('all')">
          ${icons.tag} <span>Toutes</span> <span class="count">${catCounts.all}</span>
        </button>
        <button class="filter-btn ${filterCategory === 'pro' ? 'active' : ''}" onclick="setFilterCategory('pro')">
          ${icons.briefcase} <span>Pro</span> <span class="count">${catCounts.pro}</span>
        </button>
        <button class="filter-btn ${filterCategory === 'perso' ? 'active' : ''}" onclick="setFilterCategory('perso')">
          ${icons.home} <span>Perso</span> <span class="count">${catCounts.perso}</span>
        </button>
      `;

      document.getElementById('urgencyFilters').innerHTML = `
        <button class="filter-btn ${filterUrgency === 'all' ? 'active' : ''}" onclick="setFilterUrgency('all')">
          ${icons.sparkles} <span>Toutes</span> <span class="count">${urgCounts.all}</span>
        </button>
        <button class="filter-btn ${filterUrgency === 'normal' ? 'active' : ''}" onclick="setFilterUrgency('normal')">
          ${icons.clock} <span>Normal</span> <span class="count">${urgCounts.normal}</span>
        </button>
        <button class="filter-btn ${filterUrgency === 'urgent' ? 'active' : ''}" onclick="setFilterUrgency('urgent')">
          ${icons.zap} <span>Urgent</span> <span class="count">${urgCounts.urgent}</span>
        </button>
      `;
      
      document.getElementById('periodFilters').innerHTML = `
        <button class="filter-btn ${filterPeriod ? 'active' : ''}" onclick="openPeriodFilterModal()">
          ${icons.calendar} <span>${filterPeriod ? getPeriodFilterLabel(filterPeriod) : 'Période'}</span>
        </button>
      `;

      document.getElementById('sortSelect').value = sortBy;
      document.getElementById('sortDirBtn').innerHTML = sortAsc ? icons.sortAsc : icons.sortDesc;
    }

    function renderTaskList() {
      const container = document.getElementById('taskListContainer');
      
      // Expand recurring tasks (show occurrence for filterDate if set, else next)
      let filtered = expandRecurringTasks([...tasks], filterDate || null);
      
      // Search
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(t => 
          t.title.toLowerCase().includes(q) || 
          (t.contact && t.contact.toLowerCase().includes(q)) ||
          (t.tags && t.tags.some(tag => tag.toLowerCase().includes(q)))
        );
      }
      
      // Filter by status
      if (filterStatus !== 'all') {
        filtered = filtered.filter(t => t.status === filterStatus);
      }
      
      // Filter by urgency
      if (filterUrgency !== 'all') {
        filtered = filtered.filter(t => t.urgency === filterUrgency);
      }
      
      // Filter by category
      if (filterCategory !== 'all') {
        filtered = filtered.filter(t => (t.category || 'pro') === filterCategory);
      }
      
      // Filter by late
      if (filterLate) {
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        filtered = filtered.filter(t => t.status === 'todo' && t.deadline && t.deadline < todayStr);
      }
      
      // Filter by date (from calendar click)
      if (filterDate) {
        filtered = filtered.filter(t => t.deadline === filterDate);
      }
      
      // Filter by period (avant le / après le / entre le et le)
      filtered = filterTasksByPeriod(filtered);
      
      // Sort
      const urgencyOrder = { urgent: 0, normal: 1 };
      const dir = sortAsc ? 1 : -1;
      filtered.sort((a, b) => {
        // Done at bottom always
        if (a.status === 'done' && b.status !== 'done') return 1;
        if (a.status !== 'done' && b.status === 'done') return -1;
        
        let result = 0;
        switch (sortBy) {
          case 'deadline':
            if (!a.deadline && !b.deadline) result = 0;
            else if (!a.deadline) result = 1;
            else if (!b.deadline) result = -1;
            else result = a.deadline.localeCompare(b.deadline);
            break;
          case 'createdAt':
            result = new Date(a.createdAt) - new Date(b.createdAt);
            break;
          case 'urgency':
            result = urgencyOrder[a.urgency] - urgencyOrder[b.urgency];
            break;
          case 'title':
            result = a.title.localeCompare(b.title, 'fr');
            break;
        }
        return result * dir;
      });
      
      const hasFilters = filterStatus !== 'all' || filterUrgency !== 'all' || filterCategory !== 'all' || filterLate || searchQuery.trim() || filterDate || filterPeriod;
      
      // Date filter banner
      const dateBanner = filterDate ? `
        <div class="date-filter-banner">
          ${icons.calendar} Échéances du ${formatDate(filterDate + 'T00:00:00')}
          <button class="date-filter-clear" onclick="clearDateFilter()">✕ Retirer le filtre</button>
        </div>
      ` : '';

      // Period filter banner
      const periodBanner = filterPeriod ? `
        <div class="date-filter-banner">
          ${icons.calendar} Échéances : ${getPeriodFilterLabel(filterPeriod)}
          <button class="date-filter-clear" onclick="clearPeriodFilter()">✕ Retirer le filtre</button>
        </div>
      ` : '';

      if (filtered.length === 0) {
        container.innerHTML = `
          ${dateBanner}
          ${periodBanner}
          <div class="empty-state">
            <div class="empty-icon">${hasFilters ? icons.search : icons.clipboard}</div>
            <h3>${hasFilters ? 'Aucune tâche trouvée' : 'Aucune tâche pour le moment'}</h3>
            <p>${hasFilters ? 'Essayez de modifier vos filtres pour voir plus de résultats.' : 'Cliquez sur le bouton ci-dessus pour créer votre première tâche.'}</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = `
        ${dateBanner}
        ${periodBanner}
        <div class="task-list">
          ${filtered.map(task => renderTaskCard(task)).join('')}
        </div>
      `;
    }

    function renderTaskCard(task) {
      const isDone = task.status === 'done';
      const deadlineInfo = !isDone ? getDeadlineInfo(task.deadline) : null;
      const isOverdue = !isDone && deadlineInfo && deadlineInfo.class === 'overdue';
      const hasHistory = task.contactHistory && task.contactHistory.length > 0;
      // Pour une tâche récurrente, un commentaire ajouté sur une occurrence donnée
      // (task.deadline = date de l'occurrence affichée) ne doit être visible que sur
      // cette occurrence-là. Les anciens commentaires sans date d'occurrence (créés
      // avant ce correctif) restent affichés partout pour ne pas perdre de données.
      const allComments = task.comments || [];
      const comments = allComments
        .map((c, originalIndex) => ({ ...c, originalIndex }))
        .filter(c => !task.recurrence || !c.occurrenceDate || c.occurrenceDate === task.deadline);
      const commentCount = comments.length;
      
      return `
        <div class="task-card ${isDone ? 'done' : ''} ${isOverdue ? 'overdue' : ''}" id="task-${task.id}">
          <div class="task-stripe ${isDone ? 'done' : (isOverdue ? 'overdue' : task.urgency)}"></div>
          <div class="task-content">
            <div class="task-header">
              <div style="flex:1;min-width:0;">
                <div class="task-title">${task.title}</div>
                <div class="task-meta">
                  ${task.contact ? `<span class="task-meta-item">${icons.building} ${task.contact}</span>` : ''}
                </div>
                ${(!isDone && deadlineInfo) || task.recurrence ? `
                  <div class="task-meta" style="margin-top:0.25rem;">
                    ${!isDone && deadlineInfo ? `<span class="task-meta-item ${deadlineInfo.class}">${icons.calendar} ${deadlineInfo.text}</span>` : ''}
                    ${task.recurrence ? `<span class="recurrence-badge">${icons.repeat} ${getRecurrenceLabel(task)}${task._remainingCount ? ' · ' + task._remainingCount + ' restante' + (task._remainingCount > 1 ? 's' : '') : ''}</span>` : ''}
                  </div>
                ` : ''}
                <div class="task-meta" style="margin-top:0.25rem;">
                  ${!isDone ? `<span class="urgency-badge ${task.urgency}">${task.urgency === 'urgent' ? icons.zap : icons.clock} ${task.urgency === 'urgent' ? 'Urgent' : 'Normal'}</span>` : ''}
                  <span class="category-badge ${task.category || 'pro'}">${(task.category || 'pro') === 'pro' ? icons.briefcase + ' Pro' : icons.home + ' Perso'}</span>
                  ${(task.tags || []).map(tag => `<span class="tag-badge" style="cursor:pointer;" onclick="searchByTag('${tag.replace(/'/g, "\\'")}')" title="Filtrer par ce tag">${icons.tag} ${tag}</span>`).join('')}
                </div>
                ${isDone && task.completedAt ? `
                  <div class="task-completed-at">
                    ${icons.calendarCheck} Terminée le ${formatDate(task.completedAt, true)}
                  </div>
                ` : ''}
              </div>
              <button class="delete-btn" onclick="handleDelete('${task.id}', '${task.deadline}', ${!!task.recurrence})" title="Supprimer">${icons.trash}</button>
            </div>
            
            ${task.description ? `
              <div style="margin-top:0.5rem;font-size:0.825rem;color:#64748b;line-height:1.4;${isDone ? 'text-decoration:line-through;opacity:0.6;' : ''}">${task.description}</div>
            ` : ''}
            
            ${isDone && task.completionComment ? `
              <div class="task-comment">
                ${icons.message}
                <p>${task.completionComment}</p>
              </div>
            ` : ''}
            
            <div class="task-actions">
              ${isDone ? `
                <button class="task-action-btn reopen" onclick="reopenTask('${task.id}')">
                  ${icons.rotateCcw} Réouvrir la tâche
                </button>
              ` : `
                <button class="task-action-btn edit" onclick="handleEdit('${task.id}', '${task.deadline}', ${!!task.recurrence})">
                  ${icons.pencil} Modifier
                </button>
                <button class="task-action-btn finish" onclick="openCompletionModal('${task.id}', 'terminate', '${task.deadline}')">
                  ${icons.checkCircle} Terminer
                </button>
                <button class="task-action-btn followup" onclick="openCompletionModal('${task.id}', 'followup', '${task.deadline}')">
                  ${icons.refresh} Assurer un suivi
                </button>
              `}
            </div>
            
            <!-- Commentaires -->
            ${commentCount > 0 ? `
              <button class="comments-toggle" onclick="toggleComments('${task.id}')">
                ${icons.msgPlus} Commentaires (${commentCount})
                <span id="comments-chevron-${task.id}">${icons.chevronUp}</span>
              </button>
            ` : `
              <button class="comments-toggle" onclick="toggleComments('${task.id}')">
                ${icons.msgPlus} Ajouter un commentaire
              </button>
            `}
            <div class="comments-section" id="comments-${task.id}">
              ${comments.map((c) => `
                <div class="comment-item">
                  ${icons.message}
                  <div style="flex:1;min-width:0;">
                    <p>${c.text}</p>
                    <div class="comment-date">${formatDate(c.date, true)}</div>
                  </div>
                  <button class="comment-delete" onclick="deleteComment('${task.id}', ${c.originalIndex})" title="Supprimer">${icons.xSmall}</button>
                </div>
              `).join('')}
              <div class="add-comment-row">
                <input type="text" id="comment-input-${task.id}" placeholder="Écrire un commentaire..." onkeydown="if(event.key==='Enter')addComment('${task.id}', '${task.deadline || ''}')">

              </div>
            </div>

            ${hasHistory ? `
              <button class="history-toggle" onclick="toggleHistory('${task.id}')">
                ${icons.history} Historique (${task.contactHistory.length})
                <span id="history-chevron-${task.id}">${icons.chevronDown}</span>
              </button>
              <div class="history-entries hidden" id="history-${task.id}">
                ${task.contactHistory.map(entry => `
                  <div class="history-entry">
                    ${icons.message}
                    <div>
                      <div class="history-entry-header">
                        <span class="history-entry-title">${entry.taskTitle}</span>
                        <span class="history-entry-date">${formatDate(entry.completedAt, true)}</span>
                      </div>
                      <div class="history-entry-comment">${entry.comment}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    // ============ COMMENTS ============
    function toggleComments(id) {
      const section = document.getElementById(`comments-${id}`);
      const chevron = document.getElementById(`comments-chevron-${id}`);
      if (section.classList.contains('hidden')) {
        section.classList.remove('hidden');
        if (chevron) chevron.innerHTML = icons.chevronUp;
        // Focus input
        setTimeout(() => {
          const input = document.getElementById(`comment-input-${id}`);
          if (input) input.focus();
        }, 50);
      } else {
        section.classList.add('hidden');
        if (chevron) chevron.innerHTML = icons.chevronDown;
      }
    }

    function addComment(id, occurrenceDate) {
      const input = document.getElementById(`comment-input-${id}`);
      const text = input.value.trim();
      if (!text) return;
      
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      if (!task.comments) task.comments = [];
      const newComment = { text, date: new Date().toISOString() };
      if (task.recurrence && occurrenceDate) newComment.occurrenceDate = occurrenceDate;
      task.comments.push(newComment);
      saveTasks();
      render();
      // Réouvrir la section commentaires
      setTimeout(() => {
        const section = document.getElementById(`comments-${id}`);
        if (section) section.classList.remove('hidden');
        const chevron = document.getElementById(`comments-chevron-${id}`);
        if (chevron) chevron.innerHTML = icons.chevronUp;
      }, 10);
    }

    function deleteComment(id, index) {
      const task = tasks.find(t => t.id === id);
      if (!task || !task.comments) return;
      task.comments.splice(index, 1);
      saveTasks();
      render();
      // Réouvrir la section commentaires
      setTimeout(() => {
        const section = document.getElementById(`comments-${id}`);
        if (section) section.classList.remove('hidden');
        const chevron = document.getElementById(`comments-chevron-${id}`);
        if (chevron) chevron.innerHTML = icons.chevronUp;
      }, 10);
    }

    // ============ EDIT TASK ============
    function openEditModal(id) {
      completingTask = tasks.find(t => t.id === id);
      modalMode = 'edit';
      editTags = [...(completingTask.tags || [])];
      renderModal();
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    function saveEditTask() {
      const title = document.getElementById('editTitle').value.trim();
      const contact = document.getElementById('editContact').value.trim();
      const deadline = document.getElementById('editDeadline').value;
      const description = document.getElementById('editDescription')?.value.trim();
      const isRecurring = document.getElementById('editRecurring')?.checked;
      
      if (!title) { document.getElementById('editTitle').focus(); return; }
      if (!contact) { document.getElementById('editContact').focus(); return; }
      if (!deadline) { document.getElementById('editDeadline').focus(); return; }
      
      let recurrence = null;
      if (isRecurring) {
        const startDate = document.getElementById('editRecStart').value;
        const endDate = document.getElementById('editRecEnd').value;
        const days = getSelectedDays();
        if (!startDate) { document.getElementById('editRecStart').focus(); return; }
        if (!endDate) { document.getElementById('editRecEnd').focus(); return; }
        if (days.length === 0) { showToast('⚠ Sélectionnez au moins un jour'); return; }
        recurrence = { startDate, endDate, days };
      }
      
      // Récupère le tag éventuellement encore tapé (non validé par Entrée) dans le champ
      const pendingEditTagInput = document.getElementById('editTagInput');
      if (pendingEditTagInput && pendingEditTagInput.value.trim()) {
        addTagsToList(pendingEditTagInput.value, editTags);
      }

      const task = tasks.find(t => t.id === completingTask.id);
      if (task) {
        task.title = title;
        task.contact = contact;
        task.deadline = deadline;
        task.description = description || undefined;
        task.urgency = editUrgency;
        task.category = editCategory;
        task.tags = [...editTags];
        if (recurrence) {
          task.recurrence = recurrence;
        } else {
          delete task.recurrence;
        }
        saveTasks();
      }
      
      closeModal();
      render();
    }

    function addTask() {
      const title = document.getElementById('taskTitle').value.trim();
      const contact = document.getElementById('taskContact').value.trim();
      const description = document.getElementById('taskDescription').value.trim();
      const isRecurring = document.getElementById('taskRecurring')?.checked;
      
      if (!title) { document.getElementById('taskTitle').focus(); return; }
      if (!contact) { document.getElementById('taskContact').focus(); return; }
      
      let deadline = '';
      if (!isRecurring) {
        deadline = document.getElementById('taskDeadline').value;
        if (!deadline) { document.getElementById('taskDeadline').focus(); return; }
      }
      
      let recurrence = null;
      if (isRecurring) {
        const startDate = document.getElementById('recStartDate').value;
        const endDate = document.getElementById('recEndDate').value;
        const days = getSelectedDays();
        if (!startDate) { document.getElementById('recStartDate').focus(); return; }
        if (!endDate) { document.getElementById('recEndDate').focus(); return; }
        if (days.length === 0) { showToast('⚠ Sélectionnez au moins un jour'); return; }
        recurrence = { startDate, endDate, days };
        deadline = startDate; // Use start date as deadline for recurring
      }
      
      const includeHistoryBox = document.getElementById('includeHistory');
      const history = (includeHistoryBox && includeHistoryBox.checked) ? getContactHistory(contact) : [];
      
      // Récupère le tag éventuellement encore tapé (non validé par Entrée) dans le champ
      const pendingTagInput = document.getElementById('taskTagInput');
      if (pendingTagInput && pendingTagInput.value.trim()) {
        addTagsToList(pendingTagInput.value, currentTags);
      }

      const task = {
        id: generateId(),
        title,
        contact,
        deadline,
        description: description || undefined,
        urgency: currentUrgency,
        category: currentCategory,
        status: 'todo',
        createdAt: new Date().toISOString(),
        contactHistory: history,
        tags: [...currentTags],
      };
      if (recurrence) task.recurrence = recurrence;
      
      tasks.unshift(task);
      saveTasks();
      currentUrgency = settings.defaultUrgency;
      currentCategory = settings.defaultCategory;
      currentTags = [];
      isFormExpanded = false;
      render();
    }

    function deleteTask(id) {
      const card = document.getElementById(`task-${id}`);
      if (card) {

    function reopenTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.status = 'todo';
        task.completionComment = undefined;
        task.completedAt = undefined;
        // Tâche récurrente entièrement terminée : on rouvre la dernière occurrence
        // complétée, sinon la tâche reste "à faire" sans qu'aucune occurrence ne
        // redevienne visible (elle gonflerait le compteur "À faire" sans jamais
        // apparaître dans la liste).
        if (task.recurrence && task.completedDates && task.completedDates.length) {
          let dateToReopen = null;
          if (task.completionLog && task.completionLog.length) {
            dateToReopen = task.completionLog[task.completionLog.length - 1].date;
            task.completionLog = task.completionLog.slice(0, -1);
          } else {
            const deleted = task.deletedDates || [];
            const candidates = task.completedDates.filter(d => !deleted.includes(d)).sort();
            dateToReopen = candidates[candidates.length - 1];
          }
          if (dateToReopen) {
            task.completedDates = task.completedDates.filter(d => d !== dateToReopen);
          }
        }
        saveTasks();
        render();
      }
    }

    let followUpUrgency = 'normal';
    function setFollowUpUrgency(urgency) {
      followUpUrgency = urgency;
      document.querySelectorAll('.modal .urgency-btn').forEach(btn => {

    function terminateTask() {
      const comment = document.getElementById('completionComment').value.trim();
      const now = new Date().toISOString();
      
      const task = tasks.find(t => t.id === completingTask.id);
      if (task) {
        if (task.recurrence) {
          // Recurring: mark only the current occurrence date as completed
          if (!task.completedDates) task.completedDates = [];
          // The displayed deadline is the current occurrence date
          const currentDate = completingTask._displayDeadline || completingTask.deadline;
          if (currentDate && !task.completedDates.includes(currentDate)) {
            task.completedDates.push(currentDate);
          }
          // Store completion comment for this date
          if (!task.completionLog) task.completionLog = [];
          if (comment) {
            task.completionLog.push({ date: currentDate, comment, completedAt: now });
          }
          
          // Check if ALL occurrences are now completed
          const allOccurrences = getRecurrenceOccurrences(task);
          const remaining = allOccurrences.filter(d => !task.completedDates.includes(d));
          if (remaining.length === 0) {
            task.status = 'done';
            task.completionComment = comment || undefined;
            task.completedAt = now;
          }
        } else {
          task.status = 'done';
          task.completionComment = comment || undefined;
          task.completedAt = now;
        }
        saveTasks();
      }
      
      closeModal();
      render();
    }

    function createFollowUp() {
      const comment = document.getElementById('completionComment').value.trim();
      const title = document.getElementById('followUpTitle').value.trim();
      const description = document.getElementById('followUpDescription')?.value.trim();
      const deadline = document.getElementById('followUpDeadline').value;
      
      if (!title) { document.getElementById('followUpTitle').focus(); return; }
      if (!deadline) { document.getElementById('followUpDeadline').focus(); return; }
      
      const now = new Date().toISOString();
      
      // Complete current task (or current occurrence if recurring)
      const task = tasks.find(t => t.id === completingTask.id);
      if (task) {
        if (task.recurrence) {
          if (!task.completedDates) task.completedDates = [];
          const currentDate = completingTask._displayDeadline || completingTask.deadline;
          if (currentDate && !task.completedDates.includes(currentDate)) {
            task.completedDates.push(currentDate);
          }
          if (!task.completionLog) task.completionLog = [];
          if (comment) {
            task.completionLog.push({ date: currentDate, comment, completedAt: now });
          }
          const allOccurrences = getRecurrenceOccurrences(task);
          const remaining = allOccurrences.filter(d => !task.completedDates.includes(d));
          if (remaining.length === 0) {
            task.status = 'done';
            task.completionComment = comment || undefined;
            task.completedAt = now;
          }
        } else {
          task.status = 'done';
          task.completionComment = comment || undefined;
          task.completedAt = now;
        }
      }
      
      // Get updated contact history (from completed tasks with completion comments)
      const history = getContactHistory(completingTask.contact);
      
      // Convert comments from the completed task into history entries
      // (pour une tâche récurrente, on ne reprend que les commentaires de
      // l'occurrence qui vient d'être terminée)
      const completedOccurrenceDate = completingTask._displayDeadline || completingTask.deadline;
      const commentHistory = (completingTask.comments || [])
        .filter(c => !completingTask.recurrence || !c.occurrenceDate || c.occurrenceDate === completedOccurrenceDate)
        .map(c => ({
          taskId: completingTask.id,
          taskTitle: completingTask.title,
          comment: c.text,
          completedAt: c.date
        }));
      
      // Merge: comment history + contact history, sorted by date desc
      const fullHistory = [...commentHistory, ...history]
        .sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));

      // Create follow-up task
      const newTask = {
        id: generateId(),
        title,
        contact: completingTask.contact,
        deadline,
        description: description || undefined,
        urgency: followUpUrgency,
        category: completingTask.category || 'pro',
        status: 'todo',
        createdAt: now,
        contactHistory: fullHistory
      };
      
      tasks.unshift(newTask);
      saveTasks();
      followUpUrgency = 'normal';
      
      closeModal();
      render();
    }

    // ============ EXPORT / IMPORT ============
    function exportData() {
      const data = JSON.stringify(tasks, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const date = new Date().toISOString().split('T')[0];
      a.href = url;
      a.download = `suivi-taches-${date}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported)) {
            alert('Fichier invalide : le contenu doit être une liste de tâches.');
            return;
          }
          const count = imported.length;
          if (confirm(`Importer ${count} tâche${count > 1 ? 's' : ''} ?\n\nCela remplacera toutes vos données actuelles.`)) {
            tasks = imported;
            saveTasks();
            render();
          }
        } catch (err) {
          alert('Erreur de lecture du fichier. Vérifiez qu\'il s\'agit d\'un fichier JSON valide.');
        }
      };
      reader.readAsText(file);
      // Reset input pour pouvoir réimporter le même fichier
      event.target.value = '';
    }

    // ============ CLIPBOARD SYNC ============
    function showToast(message) {
      const existing = document.querySelector('.footer-toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'footer-toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    async function copyData() {
      try {
        const data = JSON.stringify(tasks);
        await navigator.clipboard.writeText(data);
        showToast(`✓ ${tasks.length} tâche${tasks.length > 1 ? 's' : ''} copiée${tasks.length > 1 ? 's' : ''} dans le presse-papier`);
      } catch (err) {
        // Fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = JSON.stringify(tasks);
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast(`✓ ${tasks.length} tâche${tasks.length > 1 ? 's' : ''} copiée${tasks.length > 1 ? 's' : ''}`);
      }
    }

    async function pasteData() {
      try {
        const text = await navigator.clipboard.readText();
        const imported = JSON.parse(text);
        if (!Array.isArray(imported)) {
          alert('Le presse-papier ne contient pas de données valides.');
          return;
        }
        const count = imported.length;
        if (confirm(`Coller ${count} tâche${count > 1 ? 's' : ''} ?\n\nCela remplacera toutes vos données actuelles.`)) {
          tasks = imported;
          saveTasks();
          render();
          showToast(`✓ ${count} tâche${count > 1 ? 's' : ''} importée${count > 1 ? 's' : ''}`);
        }
      } catch (err) {
        alert('Impossible de lire le presse-papier.\n\nVérifiez que vous avez bien copié les données depuis l\'autre appareil et que le navigateur autorise l\'accès au presse-papier.');
      }
    }

    function handleDelete(id, displayDeadline, isRecurring) {
      if (isRecurring) {
        showRecurrenceChoice(
          'Supprimer la tâche',
          'Cette tâche est récurrente. Que souhaitez-vous supprimer ?',
          () => {
            // Delete only this occurrence — add to completedDates to skip it
            const task = tasks.find(t => t.id === id);
            if (task) {
              if (!task.completedDates) task.completedDates = [];
              if (!task.completedDates.includes(displayDeadline)) {
                task.completedDates.push(displayDeadline);
              }
              // Add to a "deletedDates" to differentiate from completed
              if (!task.deletedDates) task.deletedDates = [];
              if (!task.deletedDates.includes(displayDeadline)) {
                task.deletedDates.push(displayDeadline);
              }
              // Check if all gone
              const allOcc = getRecurrenceOccurrences(task);
              const remaining = allOcc.filter(d => !task.completedDates.includes(d));
              if (remaining.length === 0) {
                tasks = tasks.filter(t => t.id !== id);
              }
              saveTasks();
              render();
            }
          },
          () => {
            // Delete all — remove entire task
            const card = document.getElementById(`task-${id}`);
            if (card) card.classList.add('deleting');
            setTimeout(() => {
              tasks = tasks.filter(t => t.id !== id);
              saveTasks();
              render();
            }, 300);
          }
        );
      } else {
        deleteTask(id);
      }
    }

    function handleEdit(id, displayDeadline, isRecurring) {
      if (isRecurring) {
        showRecurrenceChoice(
          'Modifier la tâche',
          'Cette tâche est récurrente. Que souhaitez-vous modifier ?',
          () => {
            // Edit only this occurrence: extract it as a standalone task
            const original = tasks.find(t => t.id === id);
            if (!original) return;
            
            // Mark this date as completed/removed from the recurring task
            if (!original.completedDates) original.completedDates = [];
            if (!original.completedDates.includes(displayDeadline)) {
              original.completedDates.push(displayDeadline);
            }
            if (!original.deletedDates) original.deletedDates = [];
            if (!original.deletedDates.includes(displayDeadline)) {
              original.deletedDates.push(displayDeadline);
            }
            
            // Create a new standalone task with this occurrence's date
            // Les commentaires propres à cette occurrence suivent la tâche extraite ;
            // ils quittent la tâche récurrente d'origine pour ne plus s'y afficher.
            const occurrenceComments = (original.comments || []).filter(c => c.occurrenceDate === displayDeadline);
            if (occurrenceComments.length) {
              original.comments = original.comments.filter(c => c.occurrenceDate !== displayDeadline);
            }
            const newTask = {
              id: generateId(),
              title: original.title,
              contact: original.contact,
              deadline: displayDeadline,
              urgency: original.urgency,
              category: original.category || 'pro',
              status: 'todo',
              createdAt: new Date().toISOString(),
              contactHistory: original.contactHistory || [],
              comments: occurrenceComments.map(c => { const { occurrenceDate, ...rest } = c; return rest; }),
            };
            tasks.unshift(newTask);
            
            // Check if recurring has any remaining
            const allOcc = getRecurrenceOccurrences(original);
            const remaining = allOcc.filter(d => !original.completedDates.includes(d));
            if (remaining.length === 0) {
              tasks = tasks.filter(t => t.id !== id);
            }
            
            saveTasks();
            
            // Open edit modal on the new standalone task
            completingTask = newTask;
            modalMode = 'edit';
            renderModal();
            document.getElementById('modalOverlay').classList.remove('hidden');
          },
          () => {
            // Edit all — open the recurring task itself for editing
            openEditModal(id);
          }
        );
      } else {
        openEditModal(id);
      }
    }

          <!-- Synchronisation Cloud -->
          <div class="settings-section">
            <div class="settings-section-title">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"/></svg>
              Synchronisation Cloud
            </div>
            ${isConnected ? `
              <div class="cloud-status-box">
                <span class="sync-dot green"></span>
                Connecté au cloud
                <button class="cloud-disconnect" onclick="disconnectCloud();renderSettingsModal();">Déconnecter</button>
              </div>
              <div class="footer-actions" style="justify-content:flex-start;margin-bottom:0.75rem;">
                <button class="footer-btn footer-btn-accent" onclick="syncToCloud().then(()=>{showToast('✓ Données envoyées')})">Envoyer</button>
                <button class="footer-btn" onclick="forceLoadFromCloud()">Récupérer</button>
              </div>
            ` : `
              <p style="font-size:0.8rem;color:#64748b;margin-bottom:0.75rem;">
                Synchronisez vos tâches via Google Sheets. <a href="#" onclick="openCloudSetup();return false;" style="color:#4f46e5;">Configurer →</a>
              </p>
            `}
            ${isConnected ? `
              <details style="font-size:0.8rem;color:#64748b;">
                <summary style="cursor:pointer;font-weight:500;color:#475569;">Modifier la connexion</summary>
                <div style="margin-top:0.5rem;">
                  <div class="cloud-url-input">
                    <label>URL Apps Script</label>
                    <input type="text" id="cloudUrlInput" value="${cloudUrl}" placeholder="https://script.google.com/macros/s/.../exec">
                  </div>
                  <div class="cloud-url-input">
                    <label>Mot de passe</label>
                    <input type="password" id="cloudPwdInput" value="${cloudPassword}" placeholder="Mot de passe du script">
                  </div>
                  <button class="btn btn-primary" style="margin-top:0.5rem;font-size:0.8rem;padding:0.375rem 0.75rem;" onclick="saveCloudUrl()">Mettre à jour</button>
                </div>
              </details>
            ` : ''}
          </div>

        </div>
      `;
    }

    function updateSetting(key, value) {
      settings[key] = value;
      saveSettings();
    }

    function toggleSetting(key, btn) {
      settings[key] = !settings[key];
      saveSettings();
      btn.classList.toggle('on', settings[key]);
    }

    // ============ CLOUD SYNC ============
    const APPS_SCRIPT_CODE = `// ⚠️ CHANGEZ CE MOT DE PASSE par le vôtre
var MOT_DE_PASSE = 'MonMotDePasse123';

function checkPassword(e) {
  var pwd = (e && e.parameter && e.parameter.pwd) || '';
  return pwd === MOT_DE_PASSE;
}

function doGet(e) {
  if (!checkPassword(e)) {
    return ContentService.createTextOutput(
      JSON.stringify({error: 'Mot de passe incorrect'})
    ).setMimeType(ContentService.MimeType.JSON);
  }
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Data');
  if (!sheet) {
    sheet = SpreadsheetApp.getActiveSpreadsheet().insertSheet('Data');
    sheet.getRange('A1').setValue('[]');
  }
  var data = sheet.getRange('A1').getValue() || '[]';
  return ContentService.createTextOutput(data)
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  if (!checkPassword(e)) {
    return ContentService.createTextOutput(
      JSON.stringify({error: 'Mot de passe incorrect'})
    ).setMimeType(ContentService.MimeType.JSON);
  }
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Data');
  if (!sheet) {
    sheet = SpreadsheetApp.getActiveSpreadsheet().insertSheet('Data');
  }
  sheet.getRange('A1').setValue(e.postData.contents);
  return ContentService.createTextOutput(
    JSON.stringify({success: true})
  ).setMimeType(ContentService.MimeType.JSON);
}`;

    function updateSyncIndicator() {
      const el = document.getElementById('syncIndicator');
      el.className = 'sync-indicator ' + syncStatus;
      const labels = {
        offline: '<span class="sync-dot gray"></span><span>Local</span>',
        synced: '<span class="sync-dot green"></span><span>Synchronisé</span>',
        syncing: '<span class="sync-dot blue"></span><span>Sync...</span>',
        error: '<span class="sync-dot red"></span><span>Erreur</span>'
      };
      el.innerHTML = labels[syncStatus];
    }

    async function syncToCloud() {
      if (!cloudUrl) return;
      syncStatus = 'syncing';
      updateSyncIndicator();
      try {
        const url = cloudUrl + (cloudUrl.includes('?') ? '&' : '?') + 'pwd=' + encodeURIComponent(cloudPassword);
        await fetch(url, {
          method: 'POST',
          body: JSON.stringify(tasks),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          redirect: 'follow'
        });
        syncStatus = 'synced';
      } catch (err) {
        syncStatus = 'error';
        console.error('Cloud sync error:', err);
      }
      updateSyncIndicator();
    }

    async function loadFromCloud() {
      if (!cloudUrl) return;
      syncStatus = 'syncing';
      updateSyncIndicator();
      try {
        const url = cloudUrl + (cloudUrl.includes('?') ? '&' : '?') + 'pwd=' + encodeURIComponent(cloudPassword);
        const response = await fetch(url, { redirect: 'follow' });
        const data = await response.json();
        if (data && data.error) {
          syncStatus = 'error';
          showToast('⚠ ' + data.error);
        } else if (Array.isArray(data)) {
          tasks = data;
          localStorage.setItem('taskflow-tasks', JSON.stringify(tasks));
          syncStatus = 'synced';
          render();
          showToast(`✓ ${tasks.length} tâche${tasks.length > 1 ? 's' : ''} chargée${tasks.length > 1 ? 's' : ''} depuis le cloud`);
        } else {
          syncStatus = 'error';
        }
      } catch (err) {
        syncStatus = 'error';
        console.error('Cloud load error:', err);
      }
      updateSyncIndicator();
    }

    function openCloudSetup() {
      completingTask = null;
      modalMode = 'cloud';
      renderModal();
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    function saveCloudUrl() {
      const urlInput = document.getElementById('cloudUrlInput');
      const pwdInput = document.getElementById('cloudPwdInput');
      const url = urlInput.value.trim();
      const pwd = pwdInput.value.trim();
      if (!url) { urlInput.focus(); return; }
      if (!pwd) { pwdInput.focus(); return; }
      cloudUrl = url;
      cloudPassword = pwd;
      localStorage.setItem('taskflow-cloud-url', url);
      localStorage.setItem('taskflow-cloud-pwd', pwd);
      syncStatus = 'syncing';
      updateSyncIndicator();
      closeModal();
      
      // First sync: push current local data to cloud
      syncToCloud().then(() => {
        showToast('✓ Cloud configuré et données synchronisées');
      });
    }

    function disconnectCloud() {
      cloudUrl = '';
      cloudPassword = '';
      localStorage.removeItem('taskflow-cloud-url');
      localStorage.removeItem('taskflow-cloud-pwd');
      syncStatus = 'offline';
      updateSyncIndicator();
      closeModal();
      showToast('Cloud déconnecté — données conservées en local');
    }

    function forceLoadFromCloud() {
      if (confirm('Charger les données depuis le cloud ?\n\nCela remplacera vos données locales.')) {
        loadFromCloud();
        closeModal();
      }
    }

    function copyScriptCode() {
      navigator.clipboard.writeText(APPS_SCRIPT_CODE).then(() => {
        showToast('✓ Code copié dans le presse-papier');
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = APPS_SCRIPT_CODE;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('✓ Code copié');
      });
    }

    // ============ INIT ============
    updateSyncIndicator();
    render();
    if (cloudUrl) {
      // Auto-load from cloud on startup
      loadFromCloud();
    }
    checkAndNotify();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') checkAndNotify();
    });

    // ============ PWA: Service Worker ============
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {
          // Échec silencieux (ex: ouverture en local file:// sans serveur)
        });
      });
    }
  </script>
</body>
</html>
